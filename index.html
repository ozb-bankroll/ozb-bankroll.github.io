        W = Math.round(img.width * k),
        H = Math.round(img.height * k);
      const c = document.createElement("canvas");
      c.width = W;
      c.height = H;
      const x = c.getContext("2d");
      x.drawImage(img, 0, 0, W, H);
      const im = x.getImageData(0, 0, W, H),
        px = im.data,
        n = W * H;
      const g = new Float32Array(n),
        raw = new Uint8ClampedArray(n);
      let sum = 0;
      for (let i = 0, j = 0; j < n; i += 4, j++) {
        const v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
        g[j] = v;
        raw[j] = v;
        sum += v;
      }
      if (paper) {
        const s = document.createElement("canvas"),
          sw = Math.max(8, Math.round(W / 24)),
          sh = Math.max(8, Math.round(H / 24));
        s.width = sw;
        s.height = sh;
        const sx = s.getContext("2d");
        sx.drawImage(c, 0, 0, sw, sh);
        const b = document.createElement("canvas");
        b.width = W;
        b.height = H;
        const bx = b.getContext("2d");
        bx.imageSmoothingEnabled = true;
        bx.drawImage(s, 0, 0, W, H);
        const bg = bx.getImageData(0, 0, W, H).data;
        for (let i = 0, j = 0; j < n; i += 4, j++) {
          const bv = Math.max(30, 0.299 * bg[i] + 0.587 * bg[i + 1] + 0.114 * bg[i + 2]);
          g[j] = Math.min(255, (g[j] / bv) * 235);
        }
        sum = 255 * n;
      }
      const dark = sum / n < 128;
      let lo = 255,
        hi = 0;
      for (let j = 0; j < n; j++) {
        if (dark) g[j] = 255 - g[j];
        if (g[j] < lo) lo = g[j];
        if (g[j] > hi) hi = g[j];
      }
      const span = Math.max(1, hi - lo);
      /* cases jaunes / dorées : cellules de 8 px majoritairement jaunes, regroupées */
      const C = 8,
        cw = Math.ceil(W / C),
        ch = Math.ceil(H / C),
        cell = new Uint8Array(cw * ch);
      for (let cy = 0; cy < ch; cy++)
        for (let cx = 0; cx < cw; cx++) {
          let yel = 0,
            tot = 0;
          for (let yy = cy * C; yy < Math.min(H, cy * C + C); yy += 2)
            for (let xx = cx * C; xx < Math.min(W, cx * C + C); xx += 2) {
              const i = (yy * W + xx) * 4,
                r = px[i],
                gg = px[i + 1],
                bb = px[i + 2];
              tot++;
              if (r > 190 && gg > 160 && bb < 140 && r - bb > 80) yel++;
            }
          cell[cy * cw + cx] = yel / tot > 0.35 ? 1 : 0;
        }
      const boxes = [],
        seen = new Uint8Array(cw * ch);
      for (let q = 0; q < cell.length; q++) {
        if (!cell[q] || seen[q]) continue;
        let x0 = 1e9,
          y0 = 1e9,
          x1 = -1,
          y1 = -1;
        const st = [q];
        seen[q] = 1;
        while (st.length) {
          const z = st.pop(),
            zx = z % cw,
            zy = (z / cw) | 0;
          x0 = Math.min(x0, zx);
          x1 = Math.max(x1, zx);
          y0 = Math.min(y0, zy);
          y1 = Math.max(y1, zy);
          [z - 1, z + 1, z - cw, z + cw].forEach((v) => {
            if (v >= 0 && v < cell.length && cell[v] && !seen[v] && Math.abs((v % cw) - zx) <= 1) {
              seen[v] = 1;
              st.push(v);
            }
          });
        }
        const bw = (x1 - x0 + 1) * C,
          bh = (y1 - y0 + 1) * C;
        if (bw >= 40 && bh >= 24 && bw <= W * 0.5 && bw / bh >= 1 && bw / bh <= 5)
          boxes.push({
            left: Math.max(0, x0 * C - 2),
            top: Math.max(0, y0 * C - 2),
            width: Math.min(W - x0 * C, bw + 4),
            height: Math.min(H - y0 * C, bh + 4)
          });
      }
      for (let i = 0, j = 0; j < n; i += 4, j++) {
        const v = ((g[j] - lo) * 255) / span;
        px[i] = px[i + 1] = px[i + 2] = v;
      }
      x.putImageData(im, 0, 0);
      const main = c.toDataURL("image/png");
      let gray = null;
      if (boxes.length) {
        for (let i = 0, j = 0; j < n; i += 4, j++) px[i] = px[i + 1] = px[i + 2] = raw[j];
        x.putImageData(im, 0, 0);
        gray = c.toDataURL("image/png");
      }
      res({ main: main, gray: gray, boxes: boxes.slice(0, 6) });
    };
    img.onerror = () => res({ main: dataUrl, gray: null, boxes: [] });
    img.src = dataUrl;
  });
}
const withTimeout = (pr, ms) =>
  Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
/* Lit une ou plusieurs images ; renvoie le texte cumulé et les cotes des cases jaunes */
async function readImages(urls, paper) {
  const w = await withTimeout(ocrWorker(), 40000);
  let text = "",
    boxOdds = [];
  UI.ocrSteps = urls.length;
  for (let i = 0; i < urls.length; i++) {
    UI.ocrStep = i;
    const st = document.getElementById("ocr-s");
    if (st && urls.length > 1) st.textContent = "Capture " + (i + 1) + " sur " + urls.length + "…";
    const pr = await prepImage(urls[i], paper);
    const r = await withTimeout(w.recognize(pr.main), 30000);
    text += ((r && r.data && r.data.text) || "") + "\n";
    if (pr.boxes.length && pr.gray) {
      await w.setParameters({ tessedit_char_whitelist: "0123456789,.", tessedit_pageseg_mode: "7" });
      try {
        for (const bx of pr.boxes) {
          const rr = await withTimeout(w.recognize(pr.gray, { rectangle: bx }), 8000);
          const m = ((rr && rr.data && rr.data.text) || "")
            .replace(/[ .](?=\d{3}[.,]\d{2})/g, "")
            .match(/(\d{1,5})[.,](\d{2})/);
          if (m) boxOdds.push(parseFloat(m[1] + "." + m[2]));
        }
      } finally {
        await w.setParameters({ tessedit_char_whitelist: "", tessedit_pageseg_mode: "6" });
      }
    }
  }
  return { text: text, boxOdds: boxOdds };
}
async function runOcr(urls, paper) {
  urls = [].concat(urls);
  const d0 = newDraft(paper ? "scan" : "import", { img: urls[0], imgs: urls });
  UI.draft = d0;
  sheet(
    sheetHead(paper ? "Lecture du ticket papier" : "Lecture du ticket") +
      '<div class="scan"><img class="shot" src="' +
      urls[0] +
      '" alt="Ticket"></div><div class="ocr-bar"><i id="ocr-p"></i></div><p class="lead" style="text-align:center" id="ocr-s">On lit ton ticket…</p>'
  );
  let res = { text: "", boxOdds: [] },
    err = null;
  const t0 = Date.now();
  try {
    res = await readImages(urls, paper);
  } catch (e) {
    err = e;
  }
  if (UI.draft !== d0) return;
  window.__OZB_LAST_OCR = {
    text: res.text,
    boxOdds: res.boxOdds,
    ms: Date.now() - t0,
    err: err ? String(err.message || err) : null
  };
  const p = O.parseTicketText(res.text, { boxOdds: res.boxOdds });
  if (p.found) {
    useImport();
    const pd = applyParsed(p, paper ? "scan" : "import");
    pd.img = urls[0];
    pd.imgs = urls;
    UI.draft = pd;
    if (!pd.readOk) pd.readNote += " Compare avec la capture.";
    openForm(firstMissing(pd));
  } else {
    UI.draft.readNote = err
      ? "La lecture automatique n'a pas pu démarrer (connexion ou appareil). Complète à la main : la capture reste affichée, l'import n'est pas décompté."
      : "Je n'ai pas réussi à lire ce ticket. Complète à la main : la capture reste affichée, l'import n'est pas décompté.";
    UI.draft.missing = { odds: true, stake: true, legs: true };
    openForm("f-odds");
  }
}
/* Ajoute une capture au ticket en cours : suite d'un combiné, ou cote et mise d'un ticket partagé */
async function addCapture(urls) {
  const d = UI.draft;
  if (!d) return;
  const st = document.getElementById("f-addcap");
  if (st) {
    st.disabled = true;
    st.textContent = "Lecture de la capture…";
  }
  let res;
  try {
    res = await readImages([].concat(urls), false);
  } catch (e) {
    toast("Lecture impossible. Complète à la main.");
    openForm();
    return;
  }
  if (UI.draft !== d) return;
  const p = O.parseTicketText(res.text, { boxOdds: res.boxOdds });
  const key = (s) => (s || "").toLowerCase().replace(/\s+/g, " ").trim();
  let added = 0;
  p.legs.forEach((l) => {
    const ex = d.legs.find(
      (x) => (l.match && key(x.match) === key(l.match)) || (l.pick && key(x.pick) === key(l.pick))
    );
    if (ex) {
      if (!ex.match && l.match) ex.match = l.match;
      if (!ex.pick && l.pick) ex.pick = l.pick;
    } else {
      const empty = d.legs.find((x) => !x.match && !x.pick);
      if (empty) Object.assign(empty, { match: l.match, pick: l.pick });
      else d.legs.push({ match: l.match, pick: l.pick });
      added++;
    }
  });
  const oddsWeak = !(num(d.odds) > 1) || (d.missing && d.missing.odds);
  if (p.odds && (oddsWeak || p.legs.length >= d.legs.length)) d.odds = frNum(p.odds);
  if (p.stake && !(num(d.stake) > 0)) d.stake = frNum(p.stake);
  if (!d.book && p.book) d.book = p.book;
  if (p.market && !d.market) d.market = p.market;
  if (p.ref && !d.ref) d.ref = p.ref;
  d.imgs = (d.imgs || (d.img ? [d.img] : [])).concat(urls);
  d.img = d.img || d.imgs[0];
  describeRead(d, Object.assign({}, p, { truncated: false, shared: false }));
  d.readNote =
    (added ? added + " sélection" + (added > 1 ? "s ajoutées" : " ajoutée") + ". " : "Capture ajoutée. ") + d.readNote;
  openForm(firstMissing(d));
}
function shrinkImage(file, max) {
  return new Promise((res) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / img.width, 4200 / img.height);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.9));
      };
      img.onerror = () => res(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function settle(id, r, payout) {
  const t = S.tickets.find((x) => x.id === id);
  if (!t) return;
  const before = O.streak(S);
  t.status = r;
  t.settledAt = Date.now();
  t.payout = payout != null ? r2(payout) : null;
  save();
  closeSheet();
  const p = O.profit(t);
  if (p > 0) {
    confetti();
    vibe([12, 40, 12]);
    toast("Gagné · " + sgn(p) + " · bankroll " + eur(O.bankroll(S)));
  } else if (r === "L") {
    vibe(20);
    toast("Perdu · bankroll " + eur(O.bankroll(S)) + ". Le plan continue.");
  } else toast((r === "V" ? "Remboursé" : "Cash-out " + sgn(p)) + " · bankroll " + eur(O.bankroll(S)));
  const after = O.streak(S);
  if (after > before && [3, 7, 14, 30].includes(after))
    setTimeout(() => {
      confetti("gold");
      toast(after + " jours de jeu dans ton plan. Continue comme ça.");
    }, 900);
  render();
  if (!isPremium() && !S.offerSeen && !S.demo && S.tickets.filter((x) => x.status !== "open").length >= 3) {
    S.offerSeen = true;
    save();
    setTimeout(() => {

    }, 1400);
  }

function drawRecap(ym) {
  const c = document.createElement("canvas");
  c.width = 1080;
  c.height = 1920;
  const x = c.getContext("2d");
  const m = O.monthSummary(S, ym),
    pts = O.curve(S, ym),
    st = O.streak(S);
  const g = x.createLinearGradient(0, 0, 0, 1920);
  g.addColorStop(0, "#10283a");
  g.addColorStop(1, "#050b12");
  x.fillStyle = g;
  x.fillRect(0, 0, 1080, 1920);
  const rg = x.createRadialGradient(900, 240, 0, 900, 240, 820);
  rg.addColorStop(0, "rgba(63,208,201,.32)");
  rg.addColorStop(1, "rgba(63,208,201,0)");
  x.fillStyle = rg;
  x.fillRect(0, 0, 1080, 1920);
  x.fillStyle = "#eaf2f6";
  x.font = '800 70px "Barlow Condensed", "Arial Narrow", sans-serif';
  x.fillText("OZB", 90, 200);
  x.fillStyle = "#3fd0c9";
  x.fillText("BANKROLL", 90 + x.measureText("OZB ").width, 200);
  x.fillStyle = "#8fa6b7";
  x.font = "700 36px Manrope, system-ui, sans-serif";
  x.fillText(("Mon mois · " + monthLabel(ym)).toUpperCase(), 90, 272);
  const big = sgn(m.profit);
  let fs = 230;
  x.font = "800 " + fs + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
  while (x.measureText(big).width > 900 && fs > 120) {
    fs -= 10;
    x.font = "800 " + fs + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
  }
  x.fillStyle = m.profit >= 0 ? "#5ad48a" : "#f0897c";
  x.fillText(big, 86, 560);
  x.fillStyle = "#8fa6b7";
  x.font = "600 40px Manrope, system-ui, sans-serif";
  x.fillText((m.pctOfStart >= 0 ? "+" : "−") + frNum(Math.abs(m.pctOfStart)) + " % sur ma bankroll", 90, 636);
  x.fillStyle = "rgba(255,255,255,.05)";
  roundRect(x, 90, 720, 900, 470, 40);
  x.fill();
  if (pts.length > 1) {
    let mn = Math.min(...pts),
      mx = Math.max(...pts);
    const pd = (mx - mn) * 0.18 || 10;
    mn -= pd;
    mx += pd;
    const X = (i) => 140 + (800 * i) / (pts.length - 1),
      Y = (v) => 780 + 350 * (1 - (v - mn) / (mx - mn));
    const col = pts[pts.length - 1] >= pts[0] ? "#3fd0c9" : "#f0897c";
    x.beginPath();
    pts.forEach((v, i) => (i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v))));
    x.strokeStyle = col;
    x.lineWidth = 9;
    x.lineJoin = "round";
    x.lineCap = "round";
    x.stroke();
    x.beginPath();
    x.arc(X(pts.length - 1), Y(pts[pts.length - 1]), 17, 0, 7);
    x.fillStyle = col;
    x.fill();
  }
  [
    ["Réussite", m.rate + " %"],
    ["Discipline", m.discipline + "/100"],
    ["Série", st + " j"]
  ].forEach((k, i) => {
    const bx = 90 + i * 306;
    x.fillStyle = "rgba(255,255,255,.06)";
    roundRect(x, bx, 1250, 288, 260, 32);
    x.fill();
    x.fillStyle = "#8fa6b7";
    x.font = "700 28px Manrope, system-ui, sans-serif";
    x.fillText(k[0].toUpperCase(), bx + 28, 1316);
    x.fillStyle = i === 1 ? "#3fd0c9" : "#eaf2f6";
    x.font = '800 78px "Barlow Condensed", "Arial Narrow", sans-serif';
    x.fillText(k[1], bx + 28, 1430);
  });
  x.fillStyle = "#eaf2f6";
  x.font = "800 44px Manrope, system-ui, sans-serif";
  x.fillText(m.discipline >= 80 ? "Méthode respectée." : "Objectif : plus de discipline.", 90, 1650);
  x.fillStyle = "#8fa6b7";
  x.font = "600 32px Manrope, system-ui, sans-serif";
  x.fillText("Suivi avec l'app OZB Bankroll", 90, 1706);
  x.font = "500 23px Manrope, system-ui, sans-serif";
  x.fillText("Jouer comporte des risques : endettement, dépendance. 09 74 75 13 13. Interdit aux -18 ans.", 90, 1850);
  return c.toDataURL("image/png");
}
function roundRect(x, a, b, w, h, r) {
  x.beginPath();
  x.moveTo(a + r, b);
  x.arcTo(a + w, b, a + w, b + h, r);
  x.arcTo(a + w, b + h, a, b + h, r);
  x.arcTo(a, b + h, a, b, r);
  x.arcTo(a, b, a + w, b, r);
  x.closePath();
}
function exportCsv() {
  const head = "date;match;pari;type;sport;bookmaker;type_de_pari;cote;mise;statut;resultat";
  const rows = S.tickets
    .slice()
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((t) =>
      [
        t.date,
        (t.legs || []).map((l) => l.match).join(" + "),
        (t.legs || []).map((l) => l.pick).join(" + "),
        O.TYPE_LABEL[t.type],
        t.sport || "",
        t.book || "",
        t.market || "",
        frNum(t.odds),
        frNum(t.stake),
        t.status,
        frNum(O.profit(t))
      ]
        .map((v) => {
          let x = String(v);
          if (/^[=+\-@\t\r]/.test(x) && !/^[-+]?\d+([.,]\d+)?$/.test(x)) x = "'" + x;
          return '"' + x.replace(/"/g, '""') + '"';
        })
        .join(";")
    );
  return [head].concat(rows).join("\n");
}

/* ---------- après rendu : relief, compteur ---------- */
function afterRender() {
  document.querySelectorAll("[data-tilt]").forEach((el) => {
    if (RM) return;
    const move = (e) => {
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width,
        py = (e.clientY - r.top) / r.height;
      el.style.transform =
        "rotateX(" + ((0.5 - py) * 10).toFixed(2) + "deg) rotateY(" + ((px - 0.5) * 12).toFixed(2) + "deg)";
      el.style.setProperty("--mx", (px * 100).toFixed(1) + "%");
      el.style.setProperty("--my", (py * 100).toFixed(1) + "%");
    };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerdown", move);
    el.addEventListener("pointerleave", () => {
      el.style.transform = "";
    });
  });
  const hn = document.getElementById("hero-n");
  if (hn && !RM) {
    const to = parseFloat(hn.dataset.v),
      from = UI.lastHero == null ? 0 : UI.lastHero;
    if (from !== to) {
      const t0 = performance.now();
      (function f(t) {
        const k = Math.min(1, (t - t0) / 900),
          v = from + (to - from) * (1 - Math.pow(1 - k, 3));
        hn.textContent = sgn(r2(v));
        if (k < 1) requestAnimationFrame(f);
      })(t0);
    }
    UI.lastHero = to;
  }
}

        sheetHead("Ma photo") +
          '<label class="method hero-m" for="av-f" style="cursor:pointer"><span class="mi">' +
          I("camera", 24) +
          '</span><span style="flex:1"><b>Choisir une photo</b><span>Depuis ta galerie</span></span></label><input id="av-f" type="file" accept="image/*" class="sr"><div class="label">Ou une couleur</div><div class="chips">' +
          AV_COLORS.map(
            (c) =>
              '<button class="chip" data-act="av-col" data-v="' +
              c +
              '" aria-label="Couleur ' +
              c +
              '" style="width:44px;padding:0;background:' +
              c +
              ";border-color:" +
              c +
              '"></button>'
          ).join("") +
          "</div>"
      );
      break;
    }
    case "av-col":
      S.user.color = el.dataset.v;
      S.user.photo = null;
      save();
      closeSheet();
      render();
      break;
    case "moves":
      UI.mvKind = "in";
      movesSheet();
      break;
    case "mv-kind":
      UI.mvKind = el.dataset.v;
      movesSheet();
      break;
    case "mv-go": {
      const v = num(document.getElementById("mv-a").value);
      if (!(v > 0)) {
        toast("Indique un montant.");
        break;
      }
      if (UI.mvKind === "out" && v > O.available(S)) {
        toast("Le retrait dépasse ton disponible (" + eur(O.available(S)) + ").");
        break;
      }
      S.moves.push({ id: uid(), date: today(), amount: UI.mvKind === "out" ? -r2(v) : r2(v) });
      save();
      closeSheet();
      render();
      toast((UI.mvKind === "out" ? "Retrait" : "Dépôt") + " enregistré · bankroll " + eur(O.bankroll(S)));
      break;
    }
    case "reset-bk":
      sheet(
        sheetHead("Repartir de zéro") +
          '<p class="lead">Indique ta nouvelle bankroll. Ton historique reste, seul le montant de départ change à partir d\'aujourd\'hui.</p><div class="money"><label class="sr" for="rb">Nouvelle bankroll</label><input class="inp big" id="rb" inputmode="decimal" placeholder="' +
          frNum(O.bankroll(S)) +
          '" autofocus></div><button class="btn btn-primary block" data-act="reset-go">Valider</button>'
      );
      break;
    case "reset-go": {
      const v = num(document.getElementById("rb").value);
      if (!(v >= 0)) {
        toast("Indique un montant.");
        break;
      }
      const diff = r2(v - O.bankroll(S));
      if (diff) S.moves.push({ id: uid(), date: today(), amount: diff });
      save();
      closeSheet();
      render();
      toast("Nouvelle bankroll : " + eur(O.bankroll(S)));
      break;
    }
    case "plan":
      planSheet();
      break;
    case "plan-style": {
      const k = el.dataset.v;
      S.plan = { style: k, ranges: JSON.parse(JSON.stringify(O.STYLES[k].ranges)), dayCap: O.STYLES[k].dayCap };
      save();
      planSheet();
      break;
    }
    case "rg": {
      const k = el.dataset.k,
        d = +el.dataset.d,
        rgv = S.plan.ranges[k],
        step = rgv[1] <= 1.5 ? 0.25 : 0.5;
      const nl = r2(rgv[0] + d * step),
        nh = r2(rgv[1] + d * step);
      if (nl < 0.25 || nh > 10) break;
      S.plan.ranges[k] = [nl, nh];
      save();
      planSheet();
      break;
    }
    case "reminders": {
      const sw = (k, b, s) =>
        '<div class="toggle-row"><div><b>' +
        b +
        '</b><div class="hint">' +
        s +
        '</div></div><button class="sw" role="switch" aria-checked="' +
        !!S.prefs[k] +
        '" data-act="pref-sw" data-k="' +
        k +
        '" aria-label="' +
        b +
        '"></button></div>';
      sheet(
        sheetHead("Rappels") +
          '<div class="card">' +
          sw("remind", "Régler mes tickets", "Rappel dans l'app quand un ticket attend son résultat") +
          sw("weekly", "Mon bilan du dimanche", "Ton solde et ta série de la semaine, dans l’app") +
          '</div><p class="hint">Pour l’instant, les rappels s’affichent dans l’app quand tu l’ouvres. Les notifications sur l’écran verrouillé arrivent dans une prochaine version.</p>'
      );
      break;
    }
    case "pref-sw":
      S.prefs[el.dataset.k] = !S.prefs[el.dataset.k];
      save();
      el.setAttribute("aria-checked", S.prefs[el.dataset.k]);
      break;
    case "pause":
      sheet(
        sheetHead("Faire une pause") +
          '<p class="lead">Pendant la pause, tu peux régler tes tickets en cours, mais pas en ajouter. Une pause, c\'est souvent le meilleur coup de la semaine.</p>' +
          (paused()
            ? '<button class="btn btn-soft block" data-act="pause-set" data-v="0">Arrêter la pause</button>'
            : '<div class="grid3"><button class="btn btn-soft" data-act="pause-set" data-v="1">24 h</button><button class="btn btn-soft" data-act="pause-set" data-v="7">7 jours</button><button class="btn btn-soft" data-act="pause-set" data-v="30">30 jours</button></div>')
      );
      break;
    case "pause-set": {
      const d = +el.dataset.v;
      S.pauseUntil = d ? Date.now() + d * 864e5 : null;
      save();
      closeSheet();
      render();
      toast(d ? "Pause activée" : "Pause terminée");
      break;
    }
    case "help-play":
      sheet(
        sheetHead("Besoin d'aide ?") +
          '<div class="prose"><p><b>Joueurs Info Service</b> : 09 74 75 13 13, appel non surtaxé, 7 jours sur 7. Écoute, conseils et orientation, de façon anonyme.</p><p>Site : <a href="https://www.joueurs-info-service.fr" target="_blank" rel="noopener">joueurs-info-service.fr</a></p><p><b>Interdiction volontaire de jeux</b> : tu peux demander à être interdit de jeux auprès de l\'Autorité nationale des jeux (ANJ), sur <a href="https://anj.fr" target="_blank" rel="noopener">anj.fr</a>.</p><p>Tu peux aussi fixer des limites de dépôt directement chez ton bookmaker.</p></div>'
      );
      break;
    case "export":
      sheet(
        sheetHead("Exporter") +
          '<p class="lead">Tous tes tickets au format tableur (CSV). Copie le texte et colle-le dans Excel ou Google Sheets.</p><label class="sr" for="csv">Export</label><textarea class="inp" id="csv" readonly style="font-family:var(--mono);font-size:12px;min-height:200px">' +
          esc(exportCsv()) +
          '</textarea><button class="btn btn-primary block" data-act="copy-csv">' +
          I("copy") +
          "Copier</button>"
      );
      break;
    case "backup":
      sheet(
        sheetHead("Sauvegarder ou restaurer") +
          '<p class="lead">Sans compte, tes données vivent sur ce téléphone. Copie ta sauvegarde et garde-la (notes, e-mail à toi-même). Pour restaurer, colle-la ici.</p>' +
          '<label class="sr" for="bk-out">Sauvegarde</label><textarea class="inp" id="bk-out" readonly style="font-family:var(--mono);font-size:11px;min-height:110px">' +
          esc(JSON.stringify(Object.assign({}, S, { user: Object.assign({}, S.user, { photo: null }) }))) +
          '</textarea><button class="btn btn-soft block" data-act="copy-bk">' +
          I("copy") +
          "Copier ma sauvegarde</button>" +
          '<label class="label" for="bk-in">Restaurer une sauvegarde</label><textarea class="inp" id="bk-in" placeholder="Colle ici le texte de ta sauvegarde" style="font-family:var(--mono);font-size:11px;min-height:80px"></textarea><button class="btn btn-primary block" data-act="restore-go">Restaurer</button><p class="hint">La restauration remplace les données actuelles de ce téléphone.</p>'
      );
      break;
    case "copy-bk": {
      const ta = document.getElementById("bk-out");
      try {
        await navigator.clipboard.writeText(ta.value);
        toast("Sauvegarde copiée");
      } catch (err) {
        ta.select();
        toast("Texte sélectionné : copie-le.");
      }
      break;
    }
    case "restore-go": {
      let d = null;
      try {
        d = JSON.parse(document.getElementById("bk-in").value);
      } catch (err) {}
      d = cleanState(d, true);
      if (!d) {
        toast("Sauvegarde illisible. Colle le texte complet.");
        break;
      }
      /* l'abonnement ne se restaure pas depuis un texte collé : il vient de l'abonnement réel de ce téléphone */
      d.tier = S.tier;
      d.trialEnds = S.trialEnds;
      d.vip = S.vip;
      d.trialUsed = S.trialUsed || d.trialUsed;
      S = d;
      save();
      closeSheet();
      UI.tab = "home";
      render();
      toast("Sauvegarde restaurée · " + S.tickets.length + " tickets");
      break;
    }
    case "copy-csv": {
      const ta = document.getElementById("csv");
      try {
        await navigator.clipboard.writeText(ta.value);
        toast("Copié");
      } catch (err) {
        ta.select();
        toast("Texte sélectionné : copie-le.");
      }
      break;
    }
    case "demo":
      closeSheet();
      enterDemo();
      demoData();
      UI.tab = "home";
      render();
      toast("Données d'exemple chargées");
      break;
    case "demo-off": {
      const back = demoBackup();
      sheet(
        sheetHead("Quitter l'exemple") +
          (back
            ? '<p class="lead">Tu retrouves ton compte et tes tickets, exactement comme avant l\'exemple.</p><button class="btn btn-primary block" data-act="demo-back">Revenir à mon compte</button>'
            : '<p class="lead">Tu reviens à l\'écran de départ pour créer ton compte, ou tu pars directement de ta bankroll.</p><button class="btn btn-primary block" data-act="demo-back">Revenir au début</button><div class="money" style="margin-top:6px"><label class="label" for="real-b">Ou démarre direct avec ta bankroll</label><input class="inp big" id="real-b" inputmode="decimal" placeholder="200"></div><button class="btn btn-soft block" data-act="demo-off-go">Démarrer avec ce montant</button>')
      );
      break;
    }
    case "demo-back": {
      const back = demoBackup();
      try {
        localStorage.removeItem(DEMO_BACKUP);
      } catch (e) {}
      closeSheet();
      if (back) {
        S = back;
        save();
        UI.tab = "home";
        render();
        toast("Retour à ton compte");
      } else {
        S = null;
        try {
          localStorage.removeItem(KEY);
        } catch (e) {}
        UI.tab = "home";
        render();
      }
      break;
    }
    case "demo-off-go": {
      const v = num(document.getElementById("real-b").value);
      if (!(v > 0)) {
        toast("Indique un montant.");
        break;
      }
      const u = S.user,
        ob = S.onboard,
        pl = S.plan,
        pr = S.prefs;
      S = O.newState({ start: r2(v) });
      S.user = u;
      S.onboard = Object.assign({}, ob, { done: true });
      S.plan = pl;
      S.prefs = pr || S.prefs;
      save();
      closeSheet();
      render();
      toast("C'est parti avec " + eur(v));
      break;
    }
    case "wipe":
      sheet(
        sheetHead("Tout effacer") +
          '<p class="lead">Tes tickets, ta bankroll et ton compte sur ce téléphone seront supprimés. C\'est définitif.</p><button class="btn btn-soft block" style="color:var(--loss)" data-act="wipe-go">Tout effacer</button><button class="btn btn-ghost block" data-act="close">Annuler</button>'
      );
      break;
    case "wipe-go":
      try {
        localStorage.removeItem(KEY);
      } catch (err) {}
      S = null;
      closeSheet();
      render();
      break;
    case "referral": {
      const code =
        "OZB-" +
        ((S.user.name || "AMI")
          .replace(/[^A-Za-z]/g, "")
          .toUpperCase()
          .slice(0, 5) || "AMI") +
        (S.user.created ? String(S.user.created).slice(-3) : "777");
      sheet(
        sheetHead("Inviter un ami") +
          '<p class="lead">Ton ami reçoit 7 jours de Premium. Toi aussi, à son inscription.</p><div class="card" style="text-align:center"><div class="label">Ton code</div><div class="mega" style="font-size:44px;color:var(--accent)">' +
          code +
          '</div></div><button class="btn btn-primary block" data-act="copy-text" data-v="Rejoins-moi sur OZB Bankroll avec mon code ' +
          code +
          ' : 7 jours de Premium offerts.">' +
          I("copy") +
          "Copier l'invitation</button>"
      );
      break;
    }
    case "copy-text":
      try {
        await navigator.clipboard.writeText(el.dataset.v);
        toast("Invitation copiée");
      } catch (err) {
        toast(el.dataset.v);
      }
      break;
    case "code":
      sheet(
        sheetHead("J'ai un code") +
          '<div class="field"><label class="label" for="cd">Ton code</label><input class="inp" id="cd" autocapitalize="characters" placeholder="VIP-XXXX-XXXX" autofocus></div><button class="btn btn-primary block" data-act="code-go">Valider</button><p class="hint">Membre du VIP OZB ? Ton code personnel (VIP-XXXX-XXXX) t\'est envoyé en privé.</p><p class="hint">Déjà abonné sur un autre appareil ? Tape le <b>code à 6 chiffres</b> affiché dans Profil › Mon abonnement › Ajouter un appareil.</p>'
      );
      break;
    case "code-go": {
      const c = (document.getElementById("cd").value || "").trim().toUpperCase().replace(/\s+/g, "");
      if (/^VIP-?[A-Z0-9]{4}-?[A-Z0-9]{4}$/.test(c)) {
        el.disabled = true;
        el.textContent = "Vérification…";
        const r = await vipActivate(c.replace(/^VIP-?(\w{4})-?(\w{4})$/, "VIP-$1-$2"));
        if (r.ok) {
          closeSheet();
          render();
          confetti("gold");
          toast("Bienvenue dans le VIP : tout Premium est débloqué");
        } else {
          el.disabled = false;
          el.textContent = "Valider";
          toast(r.error);
        }
        break;
      }
      if (PROD && /-TEST$/.test(c)) {
        toast("Code inconnu. Vérifie l'orthographe.");
        break;
      }
      const raw = (document.getElementById("cd").value || "").trim().replace(/\s+/g, "");
      if (/^\d{6}$/.test(raw)) {
        el.disabled = true;
        el.textContent = "Vérification…";
        try {
          const r = await api("device/pair", { method: "POST", body: JSON.stringify({ code: raw, device: DEVICE }) });
          if (r.ok) {
            grant(r.data);
            closeSheet();
            render();
            confetti();
            toast("Appareil ajouté : ton abonnement est actif ici aussi");
          } else {
            el.disabled = false;
            el.textContent = "Valider";
            toast(r.data.error || "Code refusé");
          }
        } catch (e) {
          el.disabled = false;
          el.textContent = "Valider";
          toast("Pas de connexion.");
        }
        break;
      }
      if (!/^OZB-/.test(c) && /^[A-Za-z0-9_-]{6,80}$/.test(raw)) {
        el.disabled = true;
        el.textContent = "Vérification…";
        const r = await whopActivate(raw);
        if (r.ok) {
          closeSheet();
          render();
          confetti(r.tier === "vip" ? "gold" : undefined);
          toast(r.tier === "vip" ? "Bienvenue dans le VIP : tout Premium est débloqué" : "Premium activé, merci !");
        } else {
          el.disabled = false;
          el.textContent = "Valider";
          toast(r.error);
        }
        break;
      }
      if (c === "OZB-VIP-TEST") {
        S.tier = "vip";
        S.trialEnds = null;
        save();
        closeSheet();
        render();
        confetti("gold");
        toast("Bienvenue dans le VIP");
      } else if (c === "OZB-PREMIUM-TEST") {
        S.tier = "premium";
        S.trialEnds = null;
        save();
        closeSheet();
        render();
        confetti();
        toast("Premium activé");
      } else toast("Code inconnu. Vérifie l'orthographe.");
      break;
    }
    case "legal":
      sheet(
        sheetHead("Conditions et confidentialité") +
          "<div class=\"prose\"><p><b>Ce que fait l'app.</b> OZB Bankroll t'aide à suivre tes paris et ta bankroll. Ce n'est pas un site de paris : l'app ne prend aucun pari et ne touche pas à ton argent.</p><p><b>Aucune garantie de gain.</b> Les conseils de mise et les tickets OZB sont des aides à la décision. Les paris restent risqués.</p><p><b>18 ans et plus.</b> L'app est réservée aux personnes majeures.</p><p><b>Tes données.</b> Sans compte, elles restent sur ton téléphone. Avec un compte, ton e-mail sert seulement à retrouver ton compte. Elles ne sont jamais vendues. Tu peux tout effacer depuis Profil.</p><p><b>Mesure d'audience.</b> L'app compte de façon anonyme les ouvertures, inscriptions, ajouts de tickets et clics sur l'offre, pour savoir si elle est utile. Aucun nom, e-mail ni ticket n'est envoyé.</p><p><b>Contact.</b> ozb.prono@gmail.com</p><p class=\"hint\">Version provisoire, à faire valider avant la mise en ligne sur les stores.</p></div>"
      );
      break;
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "ob-name") {
    UI.ob.name = t.value;
    const b = document.querySelector('[data-act="ob-next"]');
    if (b) b.disabled = !t.value.trim();
  } else if (t.id === "ob-start") {
    const v = num(t.value);
    if (v > 0) {
      UI.ob.start = r2(v);
      document
        .querySelectorAll('[data-act="ob-start"]')
        .forEach((c) => c.setAttribute("aria-pressed", String(+c.dataset.v === UI.ob.start)));
    }
  } else if (t.id === "ob-cap") {
    UI.ob.dayCap = +t.value;
    document.getElementById("cap-v").textContent = pct(UI.ob.dayCap);
    document.getElementById("cap-e").textContent =
      "soit " + eur(r2((UI.ob.start * UI.ob.dayCap) / 100)) + " maximum engagés dans une journée";
  } else if (t.id === "cap2") {
    S.plan.dayCap = +t.value;
    save();
    document.getElementById("cap2-v").textContent = pct(S.plan.dayCap);
  } else if (t.id === "tsearch") {
    UI.tSearch = t.value;
    clearTimeout(window.__ts);
    window.__ts = setTimeout(() => {
      render();
      const s = document.getElementById("tsearch");
      if (s) {
        s.focus();
        s.setSelectionRange(s.value.length, s.value.length);
      }
    }, 250);
  } else if (
    UI.addStep === "form" &&
    (t.id === "f-odds" || t.id === "f-stake" || t.dataset.leg != null || t.id === "f-note" || t.id === "f-date")
  ) {
    readForm();
    if (t.id === "f-stake") UI.draft.acked = false;
    if (t.id === "f-odds" || t.id === "f-stake") refreshFormLive();
  }
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if ((t.id === "imp-f" || t.id === "imp-cam") && t.files && t.files[0]) {
    const urls = [];
    for (const f of Array.from(t.files).slice(0, 8)) urls.push(await shrinkImage(f, 1200));
    const paper = t.id === "imp-cam" || t.dataset.paper === "1";
    /* plusieurs captures d'un coup : un seul long ticket, ou plusieurs tickets à enregistrer l'un après l'autre */
    if (urls.length > 1) {
      UI.pickUrls = urls;
      UI.pickPaper = paper;
      sheet(
        sheetHead(urls.length + " captures") +
          '<p class="lead">Ces captures, c\'est…</p><button class="btn btn-primary block" data-act="imp-one">Un seul ticket (combiné trop long pour 1 capture)</button><button class="btn btn-soft block" data-act="imp-many">' +
          urls.length +
          " tickets différents</button>"
      );
    } else runOcr(urls, paper);
  } else if (t.id === "f-addcap-f" && t.files && t.files[0]) {
    readForm();
    const urls = [];
    for (const f of Array.from(t.files).slice(0, 8)) urls.push(await shrinkImage(f, 1200));
    addCapture(urls);
  } else if (t.id === "av-f" && t.files && t.files[0]) {
    /* format illisible par le navigateur (ex. HEIC) : shrinkImage renvoie le fichier brut, qu'on ne garde pas */
    const ph = await shrinkImage(t.files[0], 160);
    if (!okPhoto(ph)) {
      t.value = "";
      toast("Cette photo n'a pas pu être lue. Essaie une photo JPEG ou PNG.");
    } else {
      S.user.photo = ph;
      save();
      closeSheet();
      render();
      toast("Photo mise à jour");
    }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && LAYER.innerHTML) closeSheet();
  if (e.key === "Enter" && e.target.id === "ob-name") {
    const b = document.querySelector('[data-act="ob-next"]');
    if (b && !b.disabled) b.click();
  }
});

window.__OZB_APP = {
  get S() {
    return S;
  },
  UI,
  render
};
track("open");
if (STANDALONE()) track("install");
if (S && S.vip) {
  vipCheck(false).then(loadVipFeed);
}
render();
try {
  {
    const qc = (location.search.match(/[?&]claim=([\w-]{10,40})/) || [])[1];
    if (qc && S && S.onboard && S.onboard.done) {
      if (!S.pendingClaim || S.pendingClaim.id !== qc) S.pendingClaim = { id: qc, at: Date.now() };
      save();
      history.replaceState(null, "", location.pathname);
      setTimeout(() => claimCheck(true), 300);
    } else if (S && S.pendingClaim) setTimeout(claimCheck, 600);
  }
  const q = new URLSearchParams(location.search),
    shared = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n");
  if (shared && S && S.onboard && S.onboard.done) {
    history.replaceState(null, "", location.pathname);
    const p = O.parseTicketText(shared);
    if (importsLeft() > 0) {
      useImport();
      UI.draft = applyParsed(p, "share");
      openForm(firstMissing(UI.draft));
    } else needImport();
  }
} catch (e) {}
})();

</script>
