<style>@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Manrope';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2')}</style>
<style>
/* OZB Bankroll — « nuit de stade » : fond nuit, lumière de projecteur turquoise, cartes en relief.
   Une seule action principale par écran, chiffres en gros, le reste se découvre en touchant. */
:root{
  --bg:#050b12; --bg2:#0a1520; --surface:#0e1b28; --surface2:#132536; --raise:#182f44; --line:#1f3649; --line2:#2b4a63;
  --fg:#eaf2f6; --muted:#8fa6b7; --dim:#6f879a;
  --accent:#3fd0c9; --accent-hi:#7fe9e3; --accent-ink:#03201e; --accent-soft:rgba(63,208,201,.14);
  --win:#5ad48a; --win-soft:rgba(90,212,138,.14); --loss:#f0897c; --loss-soft:rgba(240,137,124,.14);
  --warn:#f2b84b; --warn-soft:rgba(242,184,75,.14); --vip:#f5c76b; --vip-soft:rgba(245,199,107,.14);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --r:18px; --spring:cubic-bezier(.2,.9,.25,1.15); --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--win)}.down{color:var(--loss)}.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Ambiance : deux projecteurs qui respirent */
.aura{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aura i{position:absolute;border-radius:50%;filter:blur(10px);opacity:.9;animation:drift 18s ease-in-out infinite alternate}
.aura i:nth-child(1){width:520px;height:520px;left:-180px;top:-200px;background:radial-gradient(closest-side,rgba(63,208,201,.20),transparent)}
.aura i:nth-child(2){width:460px;height:460px;right:-200px;top:30%;background:radial-gradient(closest-side,rgba(60,120,255,.12),transparent);animation-duration:24s}
.aura i:nth-child(3){width:380px;height:380px;left:20%;bottom:-220px;background:radial-gradient(closest-side,rgba(63,208,201,.10),transparent);animation-duration:21s}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(40px,30px,0)}}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;
  padding:calc(14px + var(--st)) max(18px,env(safe-area-inset-right,0px)) calc(120px + var(--sb)) max(18px,env(safe-area-inset-left,0px));
  animation:enter .45s var(--ease) both}
.screen.flow{padding-bottom:calc(26px + var(--sb))}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Typo */
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;line-height:.98}
h1{font-size:44px;text-transform:uppercase}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:20px;font-weight:700}
h1 em,h2 em{font-style:normal;color:var(--accent)}
p{margin:0}
.lead{font-size:16px;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.label{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.mega{font-family:var(--display);font-weight:800;font-size:66px;line-height:.92;letter-spacing:-.005em;font-variant-numeric:tabular-nums}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:16px;font-weight:800;font-size:16px;
  transition:transform .18s var(--spring),box-shadow .2s,background .2s,opacity .2s;user-select:none}
.btn:active{transform:scale(.965)}
.btn.block{width:100%}
.btn-primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent) 55%);color:var(--accent-ink);
  box-shadow:0 14px 30px -12px rgba(63,208,201,.75),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.12)}
.btn-soft{background:var(--surface2);border:1px solid var(--line2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn-ghost{color:var(--fg);font-weight:700}
.btn-vip{background:linear-gradient(180deg,#ffe0a1,var(--vip) 60%);color:#2a1b00;box-shadow:0 14px 30px -12px rgba(245,199,107,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .arr{margin-left:auto}
.btn-sm{min-height:40px;padding:0 14px;border-radius:12px;font-size:14px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);transition:transform .18s var(--spring)}
.icon-btn:active{transform:scale(.92)}
.link{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* Cartes */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:0 18px 40px -26px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
.card.tight{padding:12px 14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* Carte héros en relief (suit le doigt) */
.tilt-wrap{perspective:1100px}
.hero{position:relative;border-radius:24px;padding:20px;overflow:hidden;transform-style:preserve-3d;transition:transform .5s var(--ease);
  background:radial-gradient(120% 90% at 100% 0%,rgba(63,208,201,.22),transparent 55%),linear-gradient(160deg,#13283a,#0b1824 70%);
  border:1px solid var(--line2);box-shadow:0 40px 70px -35px rgba(0,0,0,.95),0 0 0 1px rgba(63,208,201,.06),inset 0 1px 0 rgba(255,255,255,.08)}
.hero.neg{background:radial-gradient(120% 90% at 100% 0%,rgba(240,137,124,.20),transparent 55%),linear-gradient(160deg,#1a2532,#0b1824 70%)}
.hero .sheen{position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px circle at var(--mx,70%) var(--my,0%),rgba(255,255,255,.10),transparent 45%);mix-blend-mode:screen}
.hero .z{transform:translateZ(40px)}
.hero .z2{transform:translateZ(22px)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.pill.win{background:var(--win-soft);color:var(--win);border-color:transparent}
.pill.loss{background:var(--loss-soft);color:var(--loss);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.vip{background:var(--vip-soft);color:var(--vip);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:rgba(5,11,18,.45);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:2px;min-width:0;backdrop-filter:blur(6px)}
.kpi .k{font-size:11px;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--mono);font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spark{display:block;width:100%;height:64px;margin:6px 0 2px}
.spark .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.spark .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.4s var(--ease) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* Série */
.streak{display:flex;align-items:center;gap:14px}
.flame{width:54px;height:54px;flex:0 0 54px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 70%,rgba(242,184,75,.35),rgba(242,184,75,.05) 70%);border:1px solid rgba(242,184,75,.35)}
.flame svg{animation:flick 2.4s ease-in-out infinite;transform-origin:50% 90%}
.flame.off{background:var(--surface2);border-color:var(--line);filter:grayscale(1);opacity:.7}
.flame.off svg{animation:none}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
.ring{position:relative;width:54px;height:54px;flex:0 0 54px}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--surface2)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px}

/* Analyse */
.insight{display:flex;gap:12px;align-items:flex-start}
.insight .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.locked{position:relative;overflow:hidden}
.locked .blur{filter:blur(7px);opacity:.55;pointer-events:none;user-select:none}
.locked .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px;background:linear-gradient(180deg,rgba(14,27,40,.2),rgba(14,27,40,.75))}

/* Tickets */
.tk{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:transform .2s var(--spring),border-color .2s}
.tk:active{transform:scale(.99)}
.tk-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.tk-title{font-weight:800;min-width:0;overflow-wrap:anywhere}
.tk-sub{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tk-odds{font-family:var(--mono);font-weight:600;font-size:17px;white-space:nowrap;text-align:right}
.tk-odds small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.safe{background:var(--accent-soft);color:var(--accent)}.tag.value{background:var(--win-soft);color:var(--win)}
.tag.fun{background:var(--warn-soft);color:var(--warn)}.tag.ozb{background:var(--vip-soft);color:var(--vip)}
.settle{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.settle button{min-height:44px;border-radius:12px;font-weight:800;font-size:14px;border:1px solid var(--line2);background:var(--surface2);transition:transform .15s var(--spring)}
.settle button:active{transform:scale(.95)}
.settle .w{color:var(--win);border-color:rgba(90,212,138,.35)}.settle .l{color:var(--loss);border-color:rgba(240,137,124,.35)}
.settle .m{width:44px}
.res{font-family:var(--mono);font-weight:600}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 0;font-size:13px;color:var(--muted);font-weight:700;text-transform:capitalize}

/* Segments et puces */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:38px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:all .18s var(--spring)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-family:var(--mono);font-size:12px;opacity:.8}

/* Onboarding */
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width .5s var(--ease)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:64px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:transform .18s var(--spring),border-color .2s,background .2s}
.opt:active{transform:scale(.98)}
.opt .oi{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--accent)}
.opt b{display:block;font-size:15.5px}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(180deg,rgba(63,208,201,.10),rgba(63,208,201,.03))}
.opt .ck{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex:0 0 24px;display:flex;align-items:center;justify-content:center}
.opt[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid-opts .opt{flex-direction:column;align-items:flex-start;min-height:92px}
.grid-opts .opt .ck{position:absolute;top:10px;right:10px}
.grid-opts .opt{position:relative}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}

/* Bienvenue : scène 3D */
.stage{position:relative;height:330px;perspective:1000px;margin:4px -6px 0}
.float{position:absolute;border-radius:18px;padding:14px;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 50%),var(--surface);border:1px solid var(--line2);
  box-shadow:0 34px 60px -24px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.07);will-change:transform}
.f1{left:4%;top:8px;width:62%;animation:fa 7s ease-in-out infinite}
.f2{right:2%;top:122px;width:52%;border-color:rgba(63,208,201,.6);animation:fb 8s ease-in-out infinite}
.f3{left:10%;top:226px;width:58%;animation:fc 6.5s ease-in-out infinite}
@keyframes fa{0%,100%{transform:rotateX(16deg) rotateY(-20deg) rotateZ(-5deg) translateY(0)}50%{transform:rotateX(16deg) rotateY(-20deg) rotateZ(-5deg) translateY(-10px)}}
@keyframes fb{0%,100%{transform:rotateX(12deg) rotateY(20deg) rotateZ(4deg) translateY(0)}50%{transform:rotateX(12deg) rotateY(20deg) rotateZ(4deg) translateY(9px)}}
@keyframes fc{0%,100%{transform:rotateX(22deg) rotateY(-8deg) rotateZ(2deg) translateY(0)}50%{transform:rotateX(22deg) rotateY(-8deg) rotateZ(2deg) translateY(-7px)}}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:8px}
.wk i{position:relative;height:22px;border-radius:8px;background:rgba(255,255,255,.04);border:1px dashed rgba(143,166,183,.28);font-style:normal;font-size:9.5px;font-weight:800;color:var(--dim);display:flex;align-items:center;justify-content:center}
.wk i.w,.wk i.l,.wk i.t{border:0;color:#04140c}
.wk i.w{background:linear-gradient(160deg,#c9f7da 0%,#5ad48a 45%,#2a9a5a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 10px -3px rgba(90,212,138,.75)}
.wk i.l{background:linear-gradient(160deg,#ffd0c8 0%,#f0897c 45%,#b9473a 100%);color:#2a0905;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 10px -3px rgba(240,137,124,.7)}
.wk i.t{background:rgba(63,208,201,.12);color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 14px -2px rgba(63,208,201,.8)}

/* Pièce 3D (construction du plan) */
.coin-scene{perspective:900px;display:flex;justify-content:center;padding:18px 0 6px}
.coin{position:relative;width:132px;height:132px;transform-style:preserve-3d;animation:spin 3.2s var(--ease) infinite}
.coin .face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.04em;
  background:radial-gradient(circle at 35% 30%,#a6fff9,#3fd0c9 45%,#16857f 80%);color:#04302d;box-shadow:inset 0 -8px 18px rgba(0,0,0,.25),inset 0 6px 14px rgba(255,255,255,.4),0 30px 50px -20px rgba(63,208,201,.6);backface-visibility:hidden}
.coin .back{transform:rotateY(180deg)}
.coin .edge{position:absolute;inset:0;border-radius:50%;transform:translateZ(-4px);background:#0f6b66}
@keyframes spin{0%{transform:rotateY(0)}60%{transform:rotateY(360deg)}100%{transform:rotateY(360deg)}}
.checks{display:flex;flex-direction:column;gap:12px}
.checks div{display:flex;align-items:center;gap:12px;font-weight:700;opacity:.35;transition:opacity .4s}
.checks div.on{opacity:1}
.checks i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:0 0 26px;transition:all .3s var(--spring)}
.checks div.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.08)}

/* Champs */
.field{display:flex;flex-direction:column;gap:8px}
.inp{width:100%;min-height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);font-size:16px;transition:border-color .2s,box-shadow .2s}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(63,208,201,.15)}
textarea.inp{min-height:130px;padding:12px 14px;resize:vertical;font-size:15px}
.inp.big{min-height:64px;font-family:var(--mono);font-size:26px;font-weight:600;text-align:center}
.money{position:relative}
.money .inp{padding-right:40px}
.money::after{content:"€";position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--mono);font-weight:600}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper button{min-height:52px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);font-size:22px;font-weight:700}
.range{width:100%;accent-color:var(--accent);height:30px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle-row:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:32px;flex:0 0 52px;border-radius:99px;background:var(--surface2);border:1px solid var(--line2);transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .25s var(--spring)}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;font-size:13.5px;font-weight:600;line-height:1.4}
.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.info{background:var(--accent-soft);color:var(--accent)}.alert.ok{background:var(--win-soft);color:var(--win)}
.alert svg{flex:0 0 18px;margin-top:1px}
.calc{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px dashed var(--line2);font-size:14px}

/* Barre d'onglets */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:20;width:100%;max-width:480px;
  padding:8px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;
  background:linear-gradient(180deg,rgba(5,11,18,0),rgba(5,11,18,.85) 30%,rgba(5,11,18,.97));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:800;color:var(--dim);transition:color .2s}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{color:var(--accent)}
.fab{justify-self:center;width:62px;height:62px;margin-bottom:6px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);
  background:linear-gradient(180deg,var(--accent-hi),var(--accent) 60%);box-shadow:0 16px 30px -10px rgba(63,208,201,.8),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.14);
  transform:translateY(-8px) rotate(0deg);transition:transform .25s var(--spring)}
.fab:active{transform:translateY(-6px) scale(.92)}

/* Feuilles */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,6,10,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;background:linear-gradient(180deg,#132638,#0c1925 40%);border:1px solid var(--line2);border-bottom:0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px;animation:up .42s var(--spring) both;box-shadow:0 -30px 60px -20px rgba(0,0,0,.8)}
@keyframes up{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.methods{display:flex;flex-direction:column;gap:10px}
.method{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);transition:transform .18s var(--spring)}
.method:active{transform:scale(.98)}
.method .mi{width:48px;height:48px;flex:0 0 48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.method b{display:block;font-size:16px}
.method span{font-size:13px;color:var(--muted)}
.method.hero-m{background:radial-gradient(120% 120% at 100% 0%,rgba(63,208,201,.18),transparent 60%),var(--surface);border-color:rgba(63,208,201,.5)}
.shot{border-radius:14px;max-height:220px;width:100%;object-fit:contain;background:var(--bg2);border:1px solid var(--line)}
.scan{position:relative;overflow:hidden;border-radius:14px}
.scan::after{content:"";position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,rgba(63,208,201,.35),transparent);animation:scan 1.4s linear infinite}
@keyframes scan{to{top:100%}}
.legs{display:flex;flex-direction:column;gap:8px}
.leg{display:grid;grid-template-columns:1fr 44px;gap:8px}

/* Stats */
.month-sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.month-sw b{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dh{font-size:11px;color:var(--dim);text-align:center;font-weight:800}
.cal button{aspect-ratio:1/1.08;border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid transparent;transition:transform .15s var(--spring)}
.cal button:active{transform:scale(.92)}
.cal button small{font-size:9px;font-weight:600;opacity:.95}
.cal button.w{background:rgba(90,212,138,.16);color:var(--win);border-color:rgba(90,212,138,.25)}
.cal button.l{background:rgba(240,137,124,.15);color:var(--loss);border-color:rgba(240,137,124,.22)}
.cal button.o{border-color:var(--line2);color:var(--fg)}
.cal button.today{outline:2px solid var(--accent);outline-offset:1px}
.cal .pad{visibility:hidden}
.rows{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.brow .n{color:var(--muted);font-size:12px}
.brow .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.brow .track i{position:absolute;top:0;bottom:0;border-radius:99px}
.brow .track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.big-curve{width:100%;height:auto;display:block}
.big-curve text{fill:var(--dim);font-family:var(--mono);font-size:11px}

/* Profil */
.avatar{width:64px;height:64px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:30px;color:#04201f;
  box-shadow:0 18px 30px -14px rgba(0,0,0,.8),inset 0 2px 0 rgba(255,255,255,.4)}
.menu{display:flex;flex-direction:column}
.mi-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line);font-weight:700}
.mi-row:last-child{border-bottom:0}
.mi-row .ico{width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--accent)}
.mi-row .rt{margin-left:auto;color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tier{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:7px}
.tier.free{background:var(--surface2);color:var(--muted)}.tier.premium{background:var(--accent-soft);color:var(--accent)}.tier.vip{background:var(--vip-soft);color:var(--vip)}

/* Offres */
.plan{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;padding:16px;border-radius:18px;background:var(--surface);border:2px solid var(--line);transition:transform .18s var(--spring),border-color .2s}
.plan[aria-pressed="true"]{border-color:var(--accent);background:radial-gradient(120% 120% at 100% 0%,rgba(63,208,201,.14),transparent 60%),var(--surface)}
.plan.vipc[aria-pressed="true"]{border-color:var(--vip);background:radial-gradient(120% 120% at 100% 0%,rgba(245,199,107,.14),transparent 60%),var(--surface)}
.plan .price{font-family:var(--mono);font-weight:600;font-size:20px}
.plan .badge{position:absolute;top:-11px;right:14px;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:7px;background:var(--accent);color:var(--accent-ink)}
.plan.vipc .badge{background:var(--vip);color:#2a1b00}
.feat{display:flex;flex-direction:column;gap:9px}
.feat div{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;font-weight:600}
.feat svg{flex:0 0 20px;color:var(--accent);margin-top:1px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:28px 1fr;gap:12px}
.tl i{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink)}
.tl.mid i{background:var(--surface2);color:var(--accent);border:1px solid var(--line2)}
.tl .tl-b{padding-bottom:14px}
.tl .tl-b b{display:block}
.tl .tl-b span{font-size:13px;color:var(--muted)}

/* Toast, confettis */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:60;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;
  background:var(--raise);border:1px solid var(--line2);font-weight:800;font-size:14px;box-shadow:0 20px 40px -16px rgba(0,0,0,.9);animation:drop .45s var(--spring) both}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:26px 16px}
.empty .ill{width:76px;height:76px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);transform:rotate(-6deg);box-shadow:0 20px 40px -20px rgba(63,208,201,.6)}
.legal{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.5}
.legal a{color:var(--muted)}
.prose{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--muted)}
.prose b{color:var(--fg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hello{display:flex;align-items:center;gap:10px}
.hello .av{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;color:#04201f}
.demo-band{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:800}
.demo-band button{text-decoration:underline;font-weight:800;font-size:12.5px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .spark .draw{stroke-dashoffset:0}
}
@media (min-width:520px){.app{border-left:1px solid rgba(255,255,255,.03);border-right:1px solid rgba(255,255,255,.03)}}
/* ---------- analyse ---------- */
.an .card-h .row svg{color:var(--accent)}
.seg.sm button{min-height:34px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.an > * + *{margin-top:12px}
.finding{display:flex;flex-direction:column;gap:6px;padding:13px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--loss)}
.finding.gain{border-left-color:var(--win)}
.fd-dim{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fd-t{font-size:15px;line-height:1.35}
.fd-s{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--fg);opacity:.9;padding-top:6px;border-top:1px dashed var(--line2)}
.fd-s svg{flex:none;margin-top:2px;color:var(--accent)}
.lvl{flex:none;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--line2)}
.lvl.solide{color:var(--win);border-color:rgba(90,212,138,.45)}
.lvl.tendance{color:var(--vip);border-color:rgba(245,199,107,.45)}
.lvl.faible{color:var(--muted)}
.locked.mini{border-radius:14px;min-height:150px}
.caveat{font-size:12px;color:var(--dim);line-height:1.45}
/* ---------- offres ---------- */
.plan .price small{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.cmp{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.cmp-r{display:grid;grid-template-columns:1.6fr .8fr .9fr .8fr;align-items:center;gap:4px;padding:9px 10px;font-size:12.5px;border-top:1px solid var(--line)}
.cmp-r:first-child{border-top:0}
.cmp-r span:not(:first-child){text-align:center;font-weight:700}
.cmp-r span:first-child{color:var(--muted)}
.cmp-h{background:var(--surface2);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cmp-h .acc{color:var(--accent)}.cmp-h .gold{color:var(--vip)}
.cmp .y{color:var(--accent);display:inline-flex}.cmp .n{color:var(--dim)}
.legal.test{color:var(--vip);opacity:.85}
/* ---------- import ---------- */
.ocr-bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.ocr-bar i{display:block;height:100%;width:4%;background:var(--accent);border-radius:99px;transition:width .3s}
.inp.need{border-color:var(--vip);box-shadow:0 0 0 3px rgba(245,199,107,.15)}
.linkrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);font-size:14px;font-weight:700;color:var(--fg);text-decoration:none}
.linkrow span{flex:1;min-width:0}
.linkrow svg{color:var(--accent);flex:none}
.alert.ok{border-color:rgba(90,212,138,.4)}
.sheet > *{flex-shrink:0}
.shots{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}
.shots .shot{flex:none;width:72%;scroll-snap-align:start}
/* onboarding raconté */
.lost{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:linear-gradient(180deg,rgba(240,137,124,.10),rgba(240,137,124,.03));border:1px solid rgba(240,137,124,.35);animation:rise .5s var(--ease) both}
.em{flex:none;width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:22px;background:var(--surface2);border:1px solid var(--line)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.promise{display:flex;flex-direction:column;gap:12px}
.pr{display:flex;align-items:center;gap:12px}
.notif{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.nl{flex:none;width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:14px;color:var(--accent-ink);background:linear-gradient(160deg,var(--accent-hi),var(--accent))}
@media (prefers-reduced-motion:reduce){.lost{animation:none}}
/* analyse personnelle */
.an-hero{display:flex;flex-direction:column;gap:0}
.an-hero h3{font-size:19px}
.an-s{padding:16px 0;border-top:1px solid var(--line)}
.an-hero > .between{padding-bottom:12px}
.an-big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.05;margin:6px 0 4px;letter-spacing:.01em}
.an-name{display:block;font-size:18px;margin-bottom:2px}
.an-s p{margin-top:6px;font-size:15px;line-height:1.5}
.pill.fict{background:var(--win-soft);color:var(--win);border-color:transparent}
.an-hero .locked.mini{min-height:200px;border-radius:12px}
.an-hero .link{margin-top:8px;align-self:flex-start}
.per-btn{display:flex;align-items:center;gap:8px;align-self:flex-start;font-size:14px;font-weight:700;color:var(--muted);padding:6px 2px}
.per-btn svg:last-child{margin-left:-2px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.sp-em{font-size:14px;line-height:1}
/* offres */
.feat-c{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.pbadge{flex:none;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:var(--accent-ink)}
.pw-prev .an-big{font-size:38px}
.pw-prev .locked.mini{min-height:150px}
.btn-betclic{background:#e1111a;color:#fff;border:0;text-decoration:none;justify-content:center}
.an-hero > .between{flex-wrap:wrap;row-gap:4px}
.an-hero > .between h3{flex:1 1 100%}
.an-hero > .between .pill{position:absolute;top:16px;right:16px}
.an-hero > .between h3{padding-right:0}
.an-hero:has(> .between .pill) > .between h3{padding-right:120px}
.vip-acts{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}.vip-acts .btn{white-space:nowrap}
/* ⓘ explications */
.ib{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:-4px 0 -4px 2px;vertical-align:middle;border-radius:50%;color:var(--muted);opacity:.85;position:relative}
.ib::after{content:"";position:absolute;inset:-8px}
.ib:active{color:var(--accent)}
.label .ib,.kpi .k .ib{width:18px;height:18px}
.info-b{display:flex;flex-direction:column;gap:12px}
.info-r{padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.info-r p{margin-top:6px;font-size:15px;line-height:1.5}
.info-r.ex{border-color:rgba(63,208,201,.35)}
.prof-r{display:block;margin-top:6px;font-size:11.5px;color:var(--accent);opacity:.9;letter-spacing:.01em}
.free-note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--win-soft);color:var(--fg)}
.free-note svg{flex:none;margin-top:2px;color:var(--win)}
/* plan adaptatif */
.adapt{border-color:rgba(63,208,201,.45)}
.adapt.down-c{border-color:rgba(245,199,107,.45)}
.pbadge.base{background:var(--surface2);color:var(--muted);border:1px solid var(--line2)}
.ad-row{border-top:1px solid var(--line);padding:10px 0}
.ad-row summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
.ad-row summary::-webkit-details-marker{display:none}
.ad-checks{display:flex;flex-direction:column;gap:4px;font-size:13px}
.ad-checks span{display:flex;gap:6px;align-items:center}
.ad-checks .ok{color:var(--win)}.ad-checks .ko{color:var(--muted)}
.pbadge.low{background:var(--warn-soft);color:var(--warn);border:1px solid rgba(242,184,75,.4)}.vip-acts.one{grid-template-columns:1fr}
/* installation */
.ins-band{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;background:linear-gradient(180deg,rgba(63,208,201,.14),rgba(63,208,201,.05));border:1px solid rgba(63,208,201,.45);color:var(--fg)}
.ins-band svg:first-child{flex:none}
.ins-s{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.ins-s b svg{vertical-align:middle;margin-left:4px}
.ins-n{flex:none;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink);background:linear-gradient(160deg,var(--accent-hi),var(--accent))}

/* ---------- Ordinateur (grand écran) : menu à gauche, contenu en 2 colonnes, fenêtres centrées ---------- */
@media (min-width:1024px){
  .app{max-width:none;margin:0;padding-left:248px;border:0}
  .app:not(:has(.tabbar)){padding-left:0;max-width:560px;margin:0 auto}
  .tabbar{left:0;top:0;bottom:0;transform:none;width:232px;max-width:none;padding:28px 16px;display:flex;flex-direction:column;align-items:stretch;gap:6px;
    background:rgba(8,16,25,.92);border-right:1px solid var(--line)}
  .tabbar::before{order:-2;content:"OZB Bankroll";font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;padding:0 12px 18px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px;border-radius:12px;font-size:15px}
  .tab:hover{background:rgba(255,255,255,.04);color:var(--fg)}
  .tab[aria-current="page"]{background:var(--accent-soft)}
  .fab{order:-1;justify-self:stretch;width:100%;height:50px;margin:0 0 14px;border-radius:14px;transform:none;gap:8px;font-weight:800;font-size:15px}
  .fab::after{content:"Ajouter un ticket"}
  .fab:active{transform:scale(.98)}
  .screen{width:100%;max-width:1060px;margin:0 auto;padding:28px 32px 48px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-content:start}
  .screen > *{grid-column:1 / -1;min-width:0}

  .screen > .tk, .screen > .day-h{grid-column:1 / -1;max-width:820px}
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{max-width:560px;border-radius:24px;border-bottom:1px solid var(--line2);max-height:88vh;padding-bottom:24px}

}

<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app" id="app"></div>
<div id="layer"></div>
<script>
/* OZB Bankroll — moteur de calcul (aucune dépendance au DOM) */
(function (root) {
  "use strict";

  const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
  const pad = (n) => String(n).padStart(2, "0");
  const dkey = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const ymOf = (k) => k.slice(0, 7);

  const STYLES = {
    prudent:   { label: "Prudent",   dayCap: 15, ranges: { safe: [2, 3], value: [0.5, 1], fun: [0.25, 0.5], perso: [1, 2] } },
    equilibre: { label: "Équilibré", dayCap: 20, ranges: { safe: [3, 5], value: [0.5, 2], fun: [0.5, 1], perso: [1, 3] } },
    offensif:  { label: "Offensif",  dayCap: 25, ranges: { safe: [4, 6], value: [1, 3], fun: [1, 1.5], perso: [2, 4] } }
  };
  const TYPE_LABEL = { safe: "Safe", value: "Value", fun: "Fun", perso: "Perso" };

  function newState(opts) {
    opts = opts || {};
    const style = opts.style || "equilibre";
    return {
      v: 1,
      user: opts.user || null,
      onboard: { done: false },
      plan: { style: style, ranges: JSON.parse(JSON.stringify(STYLES[style].ranges)), dayCap: STYLES[style].dayCap },
      tier: "free", trialEnds: null,
      start: opts.start || 0,
      startDate: opts.startDate || dkey(new Date()),
      moves: [],
      tickets: [],
      imports: { month: "", n: 0 },
      pauseUntil: null,
      prefs: { remind: true, weekly: true },
      demo: false
    };
  }

  /* ---------- Tickets ---------- */
  function profit(t) {
    if (!t || t.status === "open" || !t.status) return 0;
    if (t.status === "W") return r2((t.payout != null ? t.payout : t.stake * t.odds) - t.stake);
    if (t.status === "L") return -t.stake;
    if (t.status === "V") return 0;
    if (t.status === "C") return r2((t.payout || 0) - t.stake);
    return 0;
  }
  const settled = (t) => t.status && t.status !== "open";
  const legsOf = (t) => (t.legs && t.legs.length) || 1;

  function bankroll(S, beforeDate) {
    let b = S.start;
    S.moves.forEach((m) => { if (!beforeDate || m.date < beforeDate) b += m.amount; });
    S.tickets.forEach((t) => { if (settled(t) && (!beforeDate || t.date < beforeDate)) b += profit(t); });
    return r2(b);
  }
  function engaged(S, exceptId) {
    return r2(S.tickets.filter((t) => t.status === "open" && t.id !== exceptId).reduce((a, t) => a + t.stake, 0));
  }
  function available(S, exceptId) { return Math.max(0, r2(bankroll(S) - engaged(S, exceptId))); }

  /* Exposition d'une journée : mises du jour / bankroll au début du jour */
  function dayBase(S, date) {
    let b = S.start;
    S.moves.forEach((m) => { if (m.date <= date) b += m.amount; });
    S.tickets.forEach((t) => { if (settled(t) && t.date < date) b += profit(t); });
    return Math.max(0.01, r2(b));
  }
  function dayStakes(S, date, exceptId) {
    return r2(S.tickets.filter((t) => t.date === date && t.id !== exceptId).reduce((a, t) => a + t.stake, 0));
  }
  function exposure(S, date, extra, exceptId) {
    const base = dayBase(S, date);
    const st = dayStakes(S, date, exceptId) + (extra || 0);
    return { base: base, stakes: r2(st), pct: r2((st / base) * 100) };
  }

  /* ---------- Conseil de mise ---------- */
  function advice(S, type, exceptId, ctx) {
    let rg = S.plan.ranges[type] || S.plan.ranges.perso;
    const boost = ctx ? boostFor(S, ctx) : null;
    if (boost) { const b = STYLES[boost.style].ranges[type] || STYLES[boost.style].ranges.perso; rg = [Math.min(b[0], ADAPT.maxTicket), Math.min(b[1], ADAPT.maxTicket)]; }
    const av = available(S, exceptId);
    const mid = r2((rg[0] + rg[1]) / 2);
    return { low: rg[0], high: rg[1], mid: mid, avail: av, boost: boost,
      eurLow: r2(av * rg[0] / 100), eurMid: r2(av * mid / 100), eurHigh: r2(av * rg[1] / 100) };
  }

  /* Alertes non bloquantes avant validation d'un ticket */
  function checkStake(S, draft) {
    const out = [];
    if (!draft || !(draft.stake > 0)) return out;
    const ad = advice(S, draft.type || "perso", draft.id, draft);
    if (draft.stake > ad.eurHigh + 0.005) {
      out.push({ code: "over", level: "warn", max: ad.eurHigh,
        text: "Au-dessus de ton plan : " + TYPE_LABEL[draft.type || "perso"].toLowerCase() + " = " + fmtPct(ad.high) + " max, soit " + fmtEur(ad.eurHigh) + "." });
    }
    const date = draft.date || dkey(new Date());
    const ex = exposure(S, date, draft.stake, draft.id);
    const cap = ad.boost ? Math.min(S.plan.dayCap, ADAPT.maxDay) : S.plan.dayCap;
    if (ex.pct > cap + 1e-9) {
      out.push({ code: "day", level: "warn", pct: ex.pct,
        text: "Avec ce ticket, " + fmtPct(ex.pct) + " de ta bankroll est engagée aujourd'hui (limite " + fmtPct(cap) + ")." });
    }
    const lossesToday = S.tickets.filter((t) => t.date === date && t.status === "L").length;
    if (lossesToday >= 2) {
      out.push({ code: "tilt", level: "info",
        text: lossesToday + " tickets perdus aujourd'hui. Joue celui-ci seulement s'il était prévu, pas pour te refaire." });
    }
    if (draft.stake > available(S, draft.id) + 0.005) {
      out.push({ code: "avail", level: "warn", text: "Cette mise dépasse ton disponible (" + fmtEur(available(S, draft.id)) + ")." });
    }
    return out;
  }
  function inPlan(S, t) {
    if (t.basis == null || !(t.basis > 0)) return true;
    const max = t.maxPct != null ? t.maxPct : (S.plan.ranges[t.type] || S.plan.ranges.perso)[1];
    return t.stake <= r2(t.basis * max / 100) + 0.01;
  }

  /* ---------- Périodes ---------- */
  function ticketsOfMonth(S, ym) { return S.tickets.filter((t) => ymOf(t.date) === ym); }
  function monthSummary(S, ym) {
    const all = ticketsOfMonth(S, ym);
    const done = all.filter(settled);
    const p = r2(done.reduce((a, t) => a + profit(t), 0));
    const staked = r2(done.reduce((a, t) => a + t.stake, 0));
    const w = done.filter((t) => profit(t) > 0).length;
    const l = done.filter((t) => profit(t) < 0).length;
    const startB = bankroll(S, ym + "-01");
    const movesIn = r2(S.moves.filter((m) => ymOf(m.date) === ym).reduce((a, m) => a + m.amount, 0));
    const disc = all.length ? Math.round(all.filter((t) => inPlan(S, t)).length / all.length * 100) : 100;
    return { profit: p, staked: staked, roi: staked ? r2(p / staked * 100) : 0,
      wins: w, losses: l, n: done.length, open: all.length - done.length,
      rate: (w + l) ? Math.round(w / (w + l) * 100) : 0,
      startBankroll: startB, movesIn: movesIn,
      pctOfStart: startB > 0 ? r2(p / startB * 100) : 0, discipline: disc };
  }
  function dailyMap(S, ym) {
    const m = {};
    ticketsOfMonth(S, ym).forEach((t) => {
      const d = m[t.date] || (m[t.date] = { profit: 0, n: 0, open: 0 });
      d.n++; if (settled(t)) d.profit = r2(d.profit + profit(t)); else d.open++;
    });
    return m;
  }
  function curve(S, ym) {
    const start = bankroll(S, ym + "-01");
    const ev = [];
    S.moves.filter((m) => ymOf(m.date) === ym).forEach((m) => ev.push({ date: m.date, d: m.amount, k: 0 }));
    S.tickets.filter((t) => ymOf(t.date) === ym && settled(t)).forEach((t) => ev.push({ date: t.date, d: profit(t), k: t.settledAt || 1 }));
    ev.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.k - b.k));
    const pts = [start]; let b = start;
    ev.forEach((e) => { b = r2(b + e.d); pts.push(b); });
    return pts;
  }

  /* ---------- Série discipline (jours joués dans le plan, jours sans pari neutres) ---------- */
  function streak(S, todayKey) {
    todayKey = todayKey || dkey(new Date());
    const days = {};
    S.tickets.forEach((t) => { if (t.date <= todayKey) (days[t.date] = days[t.date] || []).push(t); });
    const keys = Object.keys(days).sort().reverse();
    let n = 0;
    for (const k of keys) {
      const ts = days[k];
      const ok = ts.every((t) => inPlan(S, t)) && exposure(S, k).pct <= S.plan.dayCap + 1e-9;
      if (!ok) break;
      n++;
    }
    return n;
  }

  /* ---------- Analyses (le pourquoi) ---------- */
  const ODDS_BUCKETS = [[0, 1.5, "Moins de 1,50"], [1.5, 2, "1,50 à 1,99"], [2, 3, "2,00 à 2,99"], [3, 1e9, "3,00 et plus"]];
  const DOW = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
  function groupBy(list, keyFn) {
    const g = {};
    list.forEach((t) => {
      const k = keyFn(t); if (k == null) return;
      const e = g[k] || (g[k] = { key: k, n: 0, profit: 0, staked: 0, w: 0 });
      e.n++; e.profit = r2(e.profit + profit(t)); e.staked = r2(e.staked + t.stake); if (profit(t) > 0) e.w++;
    });
    return Object.values(g).map((e) => Object.assign(e, { roi: e.staked ? r2(e.profit / e.staked * 100) : 0, rate: e.n ? Math.round(e.w / e.n * 100) : 0 }))
      .sort((a, b) => b.n - a.n);
  }
  function breakdowns(S, ym) {
    const done = ticketsOfMonth(S, ym).filter(settled);
    return {
      sport: groupBy(done, (t) => t.sport || "autre"),
      legs: groupBy(done, (t) => (legsOf(t) === 1 ? "Simple" : legsOf(t) === 2 ? "Combiné 2 matchs" : "Combiné 3 matchs et +")),
      odds: groupBy(done, (t) => { const b = ODDS_BUCKETS.find((x) => t.odds >= x[0] && t.odds < x[1]); return b ? b[2] : null; }),
      market: groupBy(done, (t) => t.market || "Autre"),
      book: groupBy(done, (t) => t.book || "Autre"),
      type: groupBy(done, (t) => TYPE_LABEL[t.type] || "Perso"),
      dow: groupBy(done, (t) => DOW[new Date(t.date + "T12:00:00").getDay()])
    };
  }
  function insight(S, ym) {
    const b = breakdowns(S, ym);
    let worst = null, best = null;
    ["legs", "odds", "sport", "market", "book", "dow", "type"].forEach((dim) => {
      b[dim].forEach((g) => {
        if (g.n < 3) return;
        if (!worst || g.profit < worst.g.profit) worst = { dim: dim, g: g };
        if (!best || g.profit > best.g.profit) best = { dim: dim, g: g };
      });
    });
    const name = (x) => {
      const k = x.g.key;
      if (x.dim === "sport") return "Le " + (SPORT_LABEL[k] || k).toLowerCase();
      if (x.dim === "legs") return k === "Simple" ? "Tes paris simples" : k === "Combiné 2 matchs" ? "Tes combinés de 2 matchs" : "Tes combinés de 3 matchs et plus";
      if (x.dim === "odds") return "Les cotes " + (k.startsWith("Moins") || k.endsWith("plus") ? k.toLowerCase() : "de " + k);
      if (x.dim === "book") return "Tes paris " + k;
      if (x.dim === "dow") return "Le " + k.toLowerCase();
      if (x.dim === "market") return "Les paris « " + k + " »";
      return "Tes tickets " + k.toLowerCase();
    };
    const out = {};
    if (worst && worst.g.profit < 0) out.worst = { text: name(worst) + " : " + fmtSigned(worst.g.profit) + " ce mois-ci (" + worst.g.n + " tickets).", label: name(worst), g: worst.g, dim: worst.dim };
    if (best && best.g.profit > 0) out.best = { text: name(best) + " : " + fmtSigned(best.g.profit) + " ce mois-ci (" + best.g.n + " tickets).", label: name(best), g: best.g, dim: best.dim };
    return out;
  }
  /* ---------- Analyse intelligente : constats personnels, non prédictifs ---------- */
  const SAMPLE = { min: 5, solid: 15, global: 10 };
  function sampleLevel(n) { return n >= SAMPLE.solid ? "solide" : n >= SAMPLE.min ? "tendance" : "faible"; }
  const LEVEL_LABEL = { solide: "Résultat solide", tendance: "Tendance à confirmer", faible: "Trop peu de données" };
  function periodTickets(S, period, ym, todayKey, from, to) {
    const done = S.tickets.filter(settled);
    todayKey = todayKey || dkey(new Date());
    if (period === "range") return done.filter((t) => (!from || t.date >= from) && (!to || t.date <= to));
    if (period === "50t") return done.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.settledAt || 0) - (a.settledAt || 0))).slice(0, 50);
    if (period === "month") return done.filter((t) => ymOf(t.date) === (ym || ymOf(todayKey)));
    const f30 = new Date(todayKey + "T12:00:00"); f30.setDate(f30.getDate() - 29);
    const fk = dkey(f30);
    return done.filter((t) => t.date >= fk && t.date <= todayKey);
  }
  const PERIOD_LABEL = { "30d": "sur les 30 derniers jours", "50t": "sur tes 50 derniers tickets", month: "ce mois-ci", range: "sur la période choisie" };
  const MONTHS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  function periodLabel(o) {
    if (o.period === "month" && o.ym && o.ym !== ymOf(o.today || dkey(new Date()))) return "en " + MONTHS_FR[+o.ym.slice(5, 7) - 1] + " " + o.ym.slice(0, 4);
    return PERIOD_LABEL[o.period || "30d"];
  }
  function periodList(S, o) { o = o || {}; return periodTickets(S, o.period || "30d", o.ym, o.today, o.from, o.to); }
  function periodSummary(S, o) {
    const list = periodList(S, o), p = r2(list.reduce((a, t) => a + profit(t), 0)), st = r2(list.reduce((a, t) => a + t.stake, 0));
    const wins = list.filter((t) => profit(t) > 0).length, losses = list.filter((t) => profit(t) < 0).length;
    return { n: list.length, profit: p, staked: st, roi: st ? r2(p / st * 100) : 0, wins: wins, losses: losses, rate: wins + losses ? Math.round(wins / (wins + losses) * 100) : 0,
      discipline: list.length ? Math.round(list.filter((t) => inPlan(S, t)).length / list.length * 100) : 100 };
  }
  function breakdownsFor(S, o) {
    const done = periodList(S, o);
    return {
      legs: groupBy(done, (t) => (legsOf(t) === 1 ? "Simple" : legsOf(t) === 2 ? "Combiné 2 matchs" : "Combiné 3 matchs et +")),
      odds: groupBy(done, (t) => { const b = ODDS_BUCKETS.find((x) => t.odds >= x[0] && t.odds < x[1]); return b ? b[2] : null; }),
      sport: groupBy(done, (t) => t.sport || "autre"), market: groupBy(done, (t) => t.market || "Autre"), book: groupBy(done, (t) => t.book || "Autre"),
      type: groupBy(done, (t) => TYPE_LABEL[t.type] || "Perso"), plan: groupBy(done, (t) => (inPlan(S, t) ? "Dans le plan" : "Hors plan")),
      dow: groupBy(done, (t) => DOW[new Date(t.date + "T12:00:00").getDay()])
    };
  }
  function groupName(dim, k) {
    if (dim === "sport") return "Tes paris " + (k === "autre" ? "sur les autres sports" : "en " + (SPORT_LABEL[k] || k).toLowerCase());
    if (dim === "legs") return k === "Simple" ? "Tes paris simples" : k === "Combiné 2 matchs" ? "Tes combinés de 2 matchs" : "Tes combinés de 3 matchs et plus";
    if (dim === "odds") return "Tes paris à cote " + (k.startsWith("Moins") ? "de moins de 1,50" : k.endsWith("plus") ? "de 3,00 et plus" : "de " + k);
    if (dim === "book") return k === "Autre" ? "Tes paris sans bookmaker indiqué" : "Tes paris sur " + k;
    if (dim === "dow") return "Tes paris du " + k.toLowerCase();
    if (dim === "market") return k === "Autre" ? "Tes paris d'autres types" : "Tes paris « " + k + " »";
    if (dim === "plan") return k === "Dans le plan" ? "Tes tickets dans ton plan" : "Tes tickets hors de ton plan";
    return "Tes tickets " + k.toLowerCase();
  }
  const DIM_TITLE = { legs: "Simples ou combinés", odds: "Tranche de cote", sport: "Sport", market: "Type de pari", book: "Bookmaker", dow: "Jour de la semaine", type: "Safe, value, fun", plan: "Respect du plan" };
  function suggestion(dim, k, kind) {
    if (kind === "gain") return "C'est ta zone la plus solide pour l'instant : garde la même méthode et la même mise.";
    if (dim === "legs" && k !== "Simple") return "Piste : limite tes combinés à 2 matchs, ou mise-les en « fun » (0,5 à 1 %), puis compare dans 30 jours.";
    if (dim === "legs") return "Piste : revois la sélection de tes paris simples avant d'augmenter leur mise.";
    if (dim === "odds" && k.startsWith("Moins")) return "Piste : sous 1,50, une seule défaite efface plusieurs victoires. Vérifie que ces paris valent le risque.";
    if (dim === "odds" && k.endsWith("plus")) return "Piste : les grosses cotes passent rarement. Si tu les gardes, classe-les en « fun » avec une petite mise.";
    if (dim === "odds") return "Piste : regarde si ces cotes viennent d'une vraie analyse ou d'un choix pour « faire monter » le gain.";
    if (dim === "sport") return "Piste : baisse ta mise sur ce sport, ou concentre-toi sur ceux où tes résultats tiennent.";
    if (dim === "market") return "Piste : revois ta façon d'analyser ce type de pari avant de le rejouer.";
    if (dim === "book") return "Piste : compare les cotes entre bookmakers avant de valider.";
    if (dim === "dow") return "Piste : regarde si tu paries plus vite ou plus souvent ce jour-là.";
    if (dim === "plan") return "Piste : quand tu sors du plan, attends le lendemain avant de valider.";
    return "Piste : applique la même méthode de mise à ces tickets.";
  }
  function analysis(S, opts) {
    opts = opts || {};
    const period = opts.period || "30d";
    const list = periodList(S, opts), PL = periodLabel(opts);
    const total = r2(list.reduce((a, t) => a + profit(t), 0));
    const staked = r2(list.reduce((a, t) => a + t.stake, 0));
    const out = { period: period, periodLabel: PL, n: list.length, profit: total, staked: staked, roi: staked ? r2(total / staked * 100) : 0,
      enough: list.length >= SAMPLE.global, need: Math.max(0, SAMPLE.global - list.length), findings: [], dims: {} };
    const dims = {
      legs: (t) => (legsOf(t) === 1 ? "Simple" : legsOf(t) === 2 ? "Combiné 2 matchs" : "Combiné 3 matchs et +"),
      odds: (t) => { const b = ODDS_BUCKETS.find((x) => t.odds >= x[0] && t.odds < x[1]); return b ? b[2] : null; },
      plan: (t) => (inPlan(S, t) ? "Dans le plan" : "Hors plan"),
      sport: (t) => t.sport || "autre", market: (t) => t.market || "Autre", book: (t) => t.book || "Autre",
      type: (t) => TYPE_LABEL[t.type] || "Perso", dow: (t) => DOW[new Date(t.date + "T12:00:00").getDay()]
    };
    Object.keys(dims).forEach((dim) => {
      const groups = groupBy(list, dims[dim]);
      const lossSum = groups.filter((g) => g.profit < 0).reduce((a, g) => a - g.profit, 0);
      groups.forEach((g) => { g.level = sampleLevel(g.n); g.lossShare = g.profit < 0 && lossSum > 0 ? Math.round(-g.profit / lossSum * 100) : 0; });
      out.dims[dim] = groups;
      if (groups.length < 2 && dim !== "plan") return;
      groups.forEach((g) => {

/* Nettoie toute donnée qui vient de l'extérieur (sauvegarde collée, stockage, serveur) :
     aucun caractère qui puisse ouvrir une balise ou sortir d'un attribut, et des valeurs connues pour les champs utilisés tels quels dans la page. */
const BAD_CH = /[<>"`\u0000-\u0008]/g;
function cleanDeep(v, depth) {
  if (depth > 8) return null;
  if (typeof v === "string") return v.replace(BAD_CH, "").slice(0, 400);
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (typeof v === "boolean" || v === null) return v;
  if (Array.isArray(v)) return v.slice(0, 5000).map((x) => cleanDeep(x, depth + 1));
  if (typeof v === "object") {
    const o = {};
    Object.keys(v)
      .slice(0, 200)
      .forEach((k) => {
        if (/^[\w-]{1,40}$/.test(k) && k !== "__proto__" && k !== "constructor" && k !== "prototype")
          o[k] = cleanDeep(v[k], depth + 1);
      });
    return o;
  }
  return null;
}
const TYPE_IDS = ["safe", "value", "fun", "perso"],
  STATUS = ["open", "W", "L", "V", "C"];
function cleanTicket(t, i) {
  if (!t || typeof t !== "object") return null;
  const n = (x, d) =>
    typeof x === "number" && isFinite(x)
      ? x
      : typeof x === "string" && x.trim() !== "" && isFinite(+x.replace(",", "."))
        ? +x.replace(",", ".")
        : d;
  t.id = /^[\w-]{1,48}$/.test(t.id || "") ? t.id : "t" + Date.now().toString(36) + i;
  t.type = TYPE_IDS.includes(t.type) ? t.type : "perso";
  t.status = STATUS.includes(t.status) ? t.status : "open";
  t.date = /^\d{4}-\d{2}-\d{2}$/.test(t.date || "") ? t.date : today();
  t.sport = /^[a-z]{1,16}$/.test(t.sport || "") ? t.sport : "foot";
  t.odds = Math.min(Math.max(n(t.odds, 1.01), 1.01), 100000);
  t.stake = Math.min(Math.max(n(t.stake, 0), 0), 1e7);
  t.legs =
    Array.isArray(t.legs) && t.legs.length
      ? t.legs.slice(0, 40).map((l) => ({ match: String((l && l.match) || ""), pick: String((l && l.pick) || "") }))
      : [{ match: "", pick: "" }];
  t.link = safeLink(t.link) || "";
  if (t.ozbId != null && !/^[\w-]{1,64}$/.test(String(t.ozbId))) t.ozbId = null;
  return t;

const isObj = (x) => !!x && typeof x === "object" && !Array.isArray(x);
const isNum = (x) => typeof x === "number" && isFinite(x);
const PHOTO_RE = /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/]+=*$/;
/* style connu : propriété propre de STYLES (pas « toString », « constructor »…) */
const isStyle = (s) => typeof s === "string" && Object.prototype.hasOwnProperty.call(O.STYLES, s);
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/;
/* Délais d'attente du plan adaptatif, rangés sous des clés « dim:clé » (ex. « league:Ligue 1 ») que cleanDeep supprimerait :
     on les lit dans la donnée brute, clé sans caractère dangereux, valeur = une date */
function cleanDays(m) {
  const o = {};
  if (isObj(m))
    Object.keys(m)
      .slice(0, 500)
      .forEach((k) => {
        const kk = k.replace(BAD_CH, "").slice(0, 120);
        if (kk && kk !== "__proto__" && kk !== "constructor" && kk !== "prototype" && DAY_RE.test(m[k] || ""))

}
/* Plan de mise : style connu, fourchettes [min, max] dans les bornes de l'app (0,25 à 10 %), plafond du jour de 5 à 40 % */
function cleanPlan(p, raw) {
  const style = isObj(p) && isStyle(p.style) ? p.style : "equilibre",
    def = O.STYLES[style];
  const ranges = {};
  TYPE_IDS.forEach((k) => {
    const r = isObj(p) && isObj(p.ranges) ? p.ranges[k] : null;
    ranges[k] =
      Array.isArray(r) && r.length === 2 && r.every(isNum) && r[0] >= 0.25 && r[0] <= r[1] && r[1] <= 10
        ? r
        : def.ranges[k].slice();
  });
  const cap = isObj(p) && isNum(p.dayCap) && p.dayCap >= 5 && p.dayCap <= 40 ? p.dayCap : def.dayCap;
  const out = Object.assign({}, isObj(p) ? p : {}, { style: style, ranges: ranges, dayCap: cap });
  if (!isObj(out.adapt)) delete out.adapt;
  else {
    const A = out.adapt,
      rawA = isObj(raw) && isObj(raw.adapt) ? raw.adapt : {};
    A.overrides = (Array.isArray(A.overrides) ? A.overrides : []).filter(
      (o) => isObj(o) && typeof o.dim === "string" && typeof o.key === "string" && isStyle(o.style)

    A.log = Array.isArray(A.log) ? A.log.filter(isObj) : [];

/* Champs utilisés tels quels : compteur d'imports du mois, sports et bookmakers favoris, préférences */
function cleanSmall(d, base) {

    isObj(im) && /^(\d{4}-\d{2})?$/.test(im.month || "") && Number.isInteger(im.n) && im.n >= 0 && im.n <= 1e4

function confetti(kind) {
  if (RM) return;
  const cv = document.createElement("canvas");
  cv.id = "confetti";
  document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  const c = cv.getContext("2d");
  c.scale(dpr, dpr);
  const cols = kind === "gold" ? ["#f5c76b", "#ffe2a4", "#fff"] : ["#3fd0c9", "#7fe9e3", "#5ad48a", "#fff"];
  const P = Array.from({ length: 90 }, () => ({
    x: innerWidth / 2,
    y: innerHeight * 0.38,
    vx: (Math.random() - 0.5) * 12,
    vy: -Math.random() * 13 - 4,
    r: Math.random() * 6 + 3,
    a: Math.random() * 6,
    va: (Math.random() - 0.5) * 0.4,
    col: cols[(Math.random() * cols.length) | 0]
  }));
  let t = 0;
  (function f() {
    c.clearRect(0, 0, innerWidth, innerHeight);
    t++;
    P.forEach((p) => {
      p.vy += 0.35;
      p.x += p.vx;
      p.y += p.vy;
      p.a += p.va;
      c.save();
      c.translate(p.x, p.y);
      c.rotate(p.a);
      c.fillStyle = p.col;
      c.globalAlpha = Math.max(0, 1 - t / 95);
      c.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      c.restore();
    });
    if (t < 95) requestAnimationFrame(f);
    else cv.remove();
  })();
}

function sparkSvg(pts, neg) {
  if (pts.length < 2)
    return '<svg class="spark" viewBox="0 0 300 64" aria-hidden="true"><line x1="0" y1="40" x2="300" y2="40" stroke="#2b4a63" stroke-dasharray="4 5"/></svg>';
  let mn = Math.min(...pts),
    mx = Math.max(...pts);
  const pd = (mx - mn) * 0.15 || 5;
  mn -= pd;
  mx += pd;
  const X = (i) => (300 * i) / (pts.length - 1),
    Y = (v) => 6 + 52 * (1 - (v - mn) / (mx - mn));
  const d = pts.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");
  const col = neg ? "#f0897c" : "#3fd0c9";
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += Math.hypot(X(i) - X(i - 1), Y(pts[i]) - Y(pts[i - 1]));
  return (
    '<svg class="spark" viewBox="0 0 300 64" preserveAspectRatio="none" role="img" aria-label="Évolution de ta bankroll ce mois-ci"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' +
    col +
    '" stop-opacity=".35"/><stop offset="1" stop-color="' +
    col +
    '" stop-opacity="0"/></linearGradient></defs>' +
    '<line x1="0" y1="' +
    Y(pts[0]).toFixed(1) +
    '" x2="300" y2="' +
    Y(pts[0]).toFixed(1) +
    '" stroke="#2b4a63" stroke-dasharray="4 5"/>' +
    '<path d="' +
    d +
    ' L300 64 L0 64 Z" fill="url(#sg)"/><path class="ln draw" style="--len:' +
    Math.ceil(len) +
    '" d="' +
    d +
    '" stroke="' +
    col +
    '"/>' +
    '<circle cx="' +
    X(pts.length - 1).toFixed(1) +
    '" cy="' +
    Y(pts[pts.length - 1]).toFixed(1) +
    '" r="4.5" fill="' +
    col +
    '" stroke="#0b1824" stroke-width="2.5"/></svg>'
  );
}

/* ---------- carte ticket ---------- */
function ticketTitle(t) {
  const legs = t.legs && t.legs.length ? t.legs : [{ match: "" }];
  const fallback =
    (legs[0] && legs[0].pick) ||
    (t.book ? "Pari " + t.book : "Pari " + (O.SPORT_LABEL[t.sport] || "").toLowerCase()).trim();
  return legs.length > 1 ? "Combiné " + legs.length + " matchs" : legs[0].match || fallback;
}
function ticketSub(t) {
  const legs = t.legs || [];
  if (legs.length > 1)
    return legs
      .map((l) => l.match)
      .filter(Boolean)
      .join(" + ");
  return (legs[0] && legs[0].match && legs[0].pick) || [t.market, t.book].filter(Boolean).join(" · ");
}

function bigCurve(pts, ym) {
  const W = 600,
    H = 220,
    L = 46,
    R = 12,
    T = 12,
    B = 24;
  if (pts.length < 2)
    return '<div class="empty" style="padding:14px"><span class="hint">La courbe apparaît dès ton premier ticket réglé ce mois-ci.</span></div>';
  let mn = Math.min(...pts),
    mx = Math.max(...pts);
  const pd = (mx - mn) * 0.15 || 10;
  mn -= pd;
  mx += pd;
  const X = (i) => L + ((W - L - R) * i) / (pts.length - 1),
    Y = (v) => T + (H - T - B) * (1 - (v - mn) / (mx - mn));
  const d = pts.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");
  const end = pts[pts.length - 1],
    neg = end < pts[0],
    col = neg ? "#f0897c" : "#3fd0c9";
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += Math.hypot(X(i) - X(i - 1), Y(pts[i]) - Y(pts[i - 1]));
  const hi = Math.max(...pts),
    lo = Math.min(...pts);
  let g =
    '<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' +
    col +
    '" stop-opacity=".3"/><stop offset="1" stop-color="' +
    col +
    '" stop-opacity="0"/></linearGradient></defs>';
  [
    [pts[0], true],
    [hi, false],
    [lo, false]
  ].forEach(([v, s], i) => {
    if (i && Math.abs(v - pts[0]) < (mx - mn) * 0.12) return;
    g +=
      '<line x1="' +
      L +
      '" x2="' +
      (W - R) +
      '" y1="' +
      Y(v).toFixed(1) +
      '" y2="' +
      Y(v).toFixed(1) +
      '" stroke="#1f3649"' +
      (s ? ' stroke-dasharray="4 5"' : "") +
      '/><text x="' +
      (L - 6) +
      '" y="' +
      (Y(v) + 4).toFixed(1) +
      '" text-anchor="end">' +
      Math.round(v) +
      "</text>";
  });
  g +=
    '<text x="' +
    L +
    '" y="' +
    (H - 6) +
    '">1er ' +
    MONTHS[+ym.split("-")[1] - 1] +
    '</text><text x="' +
    (W - R) +
    '" y="' +
    (H - 6) +
    '" text-anchor="end">' +
    (ym === ymNow() ? "aujourd'hui" : "fin du mois") +
    "</text>";
  g +=
    '<path d="' +
    d +
    " L" +
    X(pts.length - 1).toFixed(1) +
    " " +
    (H - B) +
    " L" +
    L +
    " " +
    (H - B) +
    ' Z" fill="url(#bg)"/><path class="ln draw" style="--len:' +
    Math.ceil(len) +
    '" d="' +
    d +
    '" fill="none" stroke="' +
    col +
    '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  g +=
    '<circle cx="' +
    X(pts.length - 1).toFixed(1) +
    '" cy="' +
    Y(end).toFixed(1) +
    '" r="6" fill="' +
    col +
    '" stroke="#0e1b28" stroke-width="3"/>';
  return (
    '<svg class="big-curve spark" style="height:auto" viewBox="0 0 ' +
    W +
    " " +
    H +
    '" role="img" aria-label="Bankroll de ' +
    eur(pts[0]) +
    " à " +
    eur(end) +
    '">' +
    g +
    "</svg>"
  );
}
function calendar(ym) {
  const [y, m] = ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1),
    nd = new Date(y, m, 0).getDate();
  const off = (first.getDay() + 6) % 7,
    map = O.dailyMap(S, ym),
    td = today();
  let h = '<div class="cal">' + DOWS.map((d) => '<span class="dh">' + d + "</span>").join("");
  for (let i = 0; i < off; i++) h += '<button class="pad" tabindex="-1" aria-hidden="true"></button>';
  for (let d = 1; d <= nd; d++) {
    const k = ym + "-" + String(d).padStart(2, "0"),
      e = map[k];
    const cls = e ? (e.profit > 0.004 ? "w" : e.profit < -0.004 ? "l" : "o") : "";
    const amt =
      e && Math.abs(e.profit) > 0.004
        ? (e.profit > 0 ? "+" : "−") + Math.round(Math.abs(e.profit))
        : e && e.open
          ? "•"
          : "";
    h +=
      '<button class="' +
      cls +
      (k === td ? " today" : "") +
      '" data-act="day" data-k="' +
      k +
      '"' +
      (e ? "" : " disabled") +
      ' aria-label="' +
      d +
      " " +
      MONTHS[m - 1] +
      (e ? ", " + sgn(e.profit) : ", aucun pari") +
      '">' +
      d +
      (amt ? "<small>" + amt + "</small>" : "") +
      "</button>";
  }
  return h + "</div>";
}
function breakdownCard(title, groups) {
  if (!groups || !groups.length) return "";
  const max = Math.max(1, ...groups.map((g) => Math.abs(g.profit)));
  const rows = groups
    .slice(0, 6)
    .map((g) => {
      const w = (Math.abs(g.profit) / max) * 50,
        pos = g.profit >= 0;
      return (
        '<div class="brow"><span><b>' +
        esc(g.key) +

/* Message clair : ce qui a été lu, ce qui manque, ce qui est à vérifier */
function describeRead(d, p) {
  const got = [],
    miss = [],
    check = [];
  if (d.book) got.push(d.book);
  const nl = d.legs.filter((l) => l.match || l.pick).length;
  if (nl) got.push(nl > 1 ? "combiné de " + nl + " sélections" : "sélection");
  if (num(d.odds) > 1) got.push("cote " + d.odds);
  else miss.push("la cote");
  if (num(d.stake) > 0) got.push("mise " + eur(num(d.stake)));
  else miss.push("la mise");
  if (p && p.oddsGuess) check.push("la cote (calculée à partir des gains, elle peut être arrondie)");
  if (p && p.oddsCheck) check.push("la cote (elle ne colle pas avec les gains affichés)");
  if (p && p.truncated)
    check.push("les sélections : Betclic n'envoie que les premières, ajoute la capture pour avoir le combiné complet");
  d.missing = {
    odds: !(num(d.odds) > 1) || !!(p && (p.oddsGuess || p.oddsCheck)),
    stake: !(num(d.stake) > 0),
    legs: !nl
  };
  if (!got.length) d.readNote = "Rien de reconnu. Complète les champs.";
  else
    d.readNote =
      "Lu : " +
      got.join(", ") +
      "." +
      (miss.length
        ? " À compléter : " +
          miss.join(" et ") +
          (p && p.shared && d.book === "Betclic" && !p.stake
            ? " (Betclic ne les met pas dans le lien partagé : ajoute la capture du ticket ou tape-les)."
            : ".")
        : "") +
      (check.length ? " À vérifier : " + check.join(" ; ") + "." : "") +
      (!miss.length && !check.length ? " Vérifie, puis valide." : "");
  d.readOk = !miss.length && !check.length;
}

/* OCR : fichiers servis avec l'app (dossier ocr/), chargés une seule fois puis gardés en mémoire */
let OCR = null;
const OCR_BASE = new URL("ocr/", location.href).href;
function loadScript(src) {
  return new Promise((res, rej) => {
    if (window.Tesseract) return res();
    const s = document.createElement("script");
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error("script"));
    document.head.appendChild(s);
  });
}
function ocrWorker() {
  if (OCR) return OCR;
  OCR = (async () => {
    await loadScript(OCR_BASE + "tesseract.min.js");
    const w = await window.Tesseract.createWorker("fra", 1, {
      workerPath: OCR_BASE + "worker.min.js",
      corePath: OCR_BASE,
      langPath: OCR_BASE,
      gzip: true,
      cacheMethod: "write",
      workerBlobURL: false,
      logger: (m) => {
        const el = document.getElementById("ocr-p");
        if (el && m && typeof m.progress === "number") {
          const base = (UI.ocrStep || 0) / (UI.ocrSteps || 1);
          el.style.width =
            Math.round(100 * (base + (m.status === "recognizing text" ? m.progress : 0) / (UI.ocrSteps || 1))) + "%";
        }
      }
    });
    await w.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "1" });
    return w;
  })();
  OCR.catch(() => {
    OCR = null;
  });
  return OCR;
}

     - texte : niveaux de gris, fond clair (inversé si l'appli est en mode sombre), contraste étiré ;
